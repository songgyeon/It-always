# render.yaml — Q Server 배포 설정
services:
  - type: web
    name: q-server
    runtime: python
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "gunicorn main:app --bind 0.0.0.0:10000 --workers 2 --timeout 120"
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: PORT
        value: 10000
