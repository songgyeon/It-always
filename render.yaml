# render.yaml — Q Server 배포 설정

services:
  - type: web
    name: q-server
    runtime: python
    plan: starter
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "gunicorn main:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: Q_MEMORY_DB
        value: /var/data/q_memory.db
      - key: PORT
        value: 10000
    disk:
      name: q-data
      mountPath: /var/data
      sizeGB: 1
