<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Q</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Special+Elite&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'BookkMyungjo';font-weight:300;src:url('/static/bookkmyungjo_light.ttf') format('truetype')}
@font-face{font-family:'BookkMyungjo';font-weight:700;src:url('/static/bookkmyungjo_bold.ttf') format('truetype')}
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#2a2a2a;
  --win:#1a1a1a;
  --paper:#f4f0e8;
  --paper-dark:#e8e4dc;
  --ink:#2c2c2c;
  --ink-light:#5a5a5a;
  --frame-bg:#c0c0c0;
  --frame-border:#888;
  --frame-light:#fff;
  --frame-dark:#555;
  --title-bar:#ddd;
  --bg-elevated:rgba(8,8,10,0.98);
  --text-user:rgba(255,255,255,0.62);
  --glow-color:rgba(255,255,255,0.5);
  --radius:0px;
  --radius-sm:0px;
  --ts:0.4s cubic-bezier(0.16,1,0.3,1);
}
html{font-size:16px}
body{
  background:#000;
  transition:background 1.5s ease;
  color:#e8e8e8;
  font-family:'BookkMyungjo','Cormorant Garamond',serif;
  font-weight:300;
  height:100dvh;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.icon{display:inline-block;object-fit:contain;pointer-events:auto;-webkit-user-drag:none}

/* ── INTRO ── */
#introScreen{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:200}
.intro-text{
  position:absolute;font-family:'BookkMyungjo','Cormorant Garamond',serif;
  font-size:clamp(20px,4vw,28px);font-weight:300;color:rgba(255,255,255,0);
  letter-spacing:0.5em;white-space:nowrap;
  transition:color 1.2s ease,transform 1.2s ease,filter 1s ease;
  transform:translateY(6px);filter:blur(2px);
}
.intro-text.visible{color:rgba(255,255,255,0.82);transform:translateY(0);filter:blur(0)}
.intro-text.fade{color:rgba(255,255,255,0);transform:translateY(-6px);filter:blur(2px)}
.intro-glow{
  position:absolute;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,0.12) 0%,rgba(255,255,255,0.03) 35%,transparent 65%);
  opacity:0;pointer-events:none;transition:opacity 2.5s ease,transform 2.5s ease;transform:scale(0.4);
}
.intro-glow.visible{opacity:1;transform:scale(1)}
.intro-q-icon{
  width:200px;height:200px;opacity:0;z-index:2;
  transition:opacity 2.5s ease,transform 2s ease;transform:scale(0.85);
  filter:drop-shadow(0 0 60px rgba(255,255,255,0.08));
}
.intro-q-icon.visible{opacity:0.88;transform:scale(1)}
.intro-input-wrap{
  position:absolute;display:flex;align-items:baseline;gap:14px;
  opacity:0;transition:opacity 1.8s ease,transform 1.5s ease;transform:translateY(6px);z-index:3;
}
.intro-input-wrap.visible{opacity:1;transform:translateY(0)}
.intro-input-wrap.fade{opacity:0;transform:translateY(-6px)}
.intro-input-label{font-family:'BookkMyungjo','Cormorant Garamond',serif;font-size:clamp(20px,4vw,28px);font-weight:300;color:rgba(255,255,255,0.82);letter-spacing:0.5em}
.intro-input-field{
  background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,0.2);outline:none;
  font-family:'BookkMyungjo','Cormorant Garamond',serif;font-size:clamp(20px,4vw,28px);font-weight:300;
  color:rgba(255,255,255,0.82);letter-spacing:0.3em;width:200px;padding-bottom:6px;
  caret-color:rgba(255,255,255,0.35);transition:border-color 0.6s;
}
.intro-input-field:focus{border-color:rgba(255,255,255,0.35)}
.intro-input-field::placeholder{color:transparent}

/* ── WAKE ── */
#wakeScreen{position:fixed;inset:0;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100;cursor:default}
.wake-glow{position:absolute;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.18) 0%,rgba(255,255,255,0.04) 40%,transparent 70%);opacity:0;pointer-events:none;animation:glowB 5s ease-in-out infinite}
@keyframes glowB{0%,100%{opacity:0.08;transform:scale(0.65)}50%{opacity:0.28;transform:scale(1.08)}}
.wake-question{font-size:clamp(16px,3.5vw,20px);font-weight:300;color:rgba(255,255,255,0);letter-spacing:0.15em;z-index:2;transition:color 2s ease,transform 1.5s ease;transform:translateY(10px)}
.wake-question.visible{color:rgba(255,255,255,0.65);transform:translateY(0)}

/* ══════════════════════════════════════
   RETRO MACINTOSH WINDOW
   ══════════════════════════════════════ */
.window{
  width:88vw;max-width:1060px;height:85vh;
  background:var(--paper);
  display:none;flex-direction:column;overflow:hidden;
  z-index:1;
  /* Retro Mac window border */
  border:2px solid #000;
  border-radius:0;
  box-shadow:
    inset 1px 1px 0 var(--frame-light),
    inset -1px -1px 0 var(--frame-dark),
    4px 4px 0 rgba(0,0,0,0.4);
}

/* ── TITLE BAR (Retro Mac) ── */
.retro-title-bar{
  height:22px;
  background:var(--frame-bg);
  border-bottom:2px solid #000;
  display:flex;
  align-items:center;
  padding:0 6px;
  flex-shrink:0;
  /* Classic Mac horizontal lines pattern */
  background:
    repeating-linear-gradient(
      0deg,
      #fff 0px, #fff 1px,
      #c0c0c0 1px, #c0c0c0 2px,
      #888 2px, #888 3px,
      #c0c0c0 3px, #c0c0c0 4px
    );
  position:relative;
}
.retro-close-box{
  width:13px;height:13px;
  border:1px solid #000;
  background:#fff;
  cursor:pointer;
  flex-shrink:0;
  position:relative;
  z-index:2;
}
.retro-close-box:active{
  background:#000;
}
.retro-title-text{
  flex:1;
  text-align:center;
  font-family:'Special Elite','Courier New',monospace;
  font-size:12px;
  color:#000;
  letter-spacing:0.08em;
  position:relative;
  z-index:2;
  background:var(--frame-bg);
  padding:0 12px;
  white-space:nowrap;
}

/* ── PLAYER (inside retro frame) ── */
.player-top{
  padding:12px 24px;
  border-bottom:1px solid rgba(0,0,0,0.12);
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--paper-dark);
}
.player{display:flex;align-items:center;gap:20px}
.p-vis{display:flex;align-items:flex-end;gap:1.5px;height:28px;flex-shrink:0}
.p-vis .vb{width:1.5px;background:rgba(0,0,0,0.08);border-radius:1px;transition:height 0.12s ease}
.p-mid{display:flex;flex-direction:column;gap:6px}
.p-title{font-family:'Special Elite','Courier New',monospace;font-size:11px;font-weight:400;color:rgba(0,0,0,0.35);letter-spacing:0.15em}
.p-controls{display:flex;align-items:center;gap:14px}
.p-btn{background:none;border:none;font-size:8px;color:rgba(0,0,0,0.2);cursor:pointer;padding:4px;transition:color 0.3s}
.p-btn:hover{color:rgba(0,0,0,0.5)}
.p-play{width:24px;height:24px;border:1px solid rgba(0,0,0,0.2);border-radius:0;display:flex;align-items:center;justify-content:center;background:#fff;color:rgba(0,0,0,0.3);font-size:8px;cursor:pointer;transition:all 0.3s}
.p-play:hover{border-color:rgba(0,0,0,0.4);color:rgba(0,0,0,0.6)}
.p-play.on{border-color:rgba(0,0,0,0.3);color:rgba(0,0,0,0.5);background:var(--paper-dark)}
.p-bar-wrap{display:flex;flex-direction:column;gap:3px;min-width:140px}
.p-bar{width:100%;height:1px;background:rgba(0,0,0,0.1);cursor:pointer;position:relative}
.p-bar-fill{position:absolute;top:0;left:0;height:100%;width:0%;background:rgba(0,0,0,0.3);transition:width 0.2s linear}
.p-time{display:flex;justify-content:space-between;font-family:'Special Elite',monospace;font-size:7px;color:rgba(0,0,0,0.15);letter-spacing:0.05em}

/* ── CHAT (paper/typewriter style) ── */
.chat-wrap{
  width:100%;display:flex;flex-direction:column;flex:1;overflow:hidden;position:relative;z-index:1;
  background:var(--paper);
  /* Subtle paper texture via noise */
  background-image:
    url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
}
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 24px;min-height:40px;position:relative;z-index:10;flex-shrink:0;
  border-bottom:1px solid rgba(0,0,0,0.08);
  background:var(--paper-dark);
}
.header::after{display:none}
.header-left{display:flex;align-items:center}
.header-left .icon{width:20px;height:20px;opacity:0.3;cursor:pointer;transition:opacity var(--ts),transform var(--ts);filter:invert(1) brightness(0)}
.header-left .icon:hover{opacity:0.6;transform:scale(1.05)}
.header-center{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;cursor:pointer}
.header-center .icon{filter:invert(1) brightness(0);transition:opacity 0.6s ease}
.header-center:hover .icon{opacity:0.5!important}
.header-right{display:flex;align-items:center;gap:14px}
.dots-icon{font-size:16px;color:rgba(0,0,0,0.3);cursor:pointer;transition:color var(--ts);padding:4px}
.dots-icon:hover{color:rgba(0,0,0,0.6)}
.header-right .icon{filter:invert(1) brightness(0)}

.chat-area{flex:1;overflow-y:auto;padding:20px 36px 24px;scroll-behavior:smooth}
.chat-area::-webkit-scrollbar{width:12px}
.chat-area::-webkit-scrollbar-track{background:var(--paper-dark)}
.chat-area::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);border:2px solid var(--paper-dark)}
.chat-area::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,0.25)}

.msg{padding:14px 0;animation:msgIn 0.8s cubic-bezier(0.16,1,0.3,1)}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg-q{padding-right:40px}
.q-label{font-size:0;margin-bottom:10px;display:flex;align-items:center}
.q-text{
  font-family:'BookkMyungjo','Special Elite',serif;
  font-size:14px;line-height:2.2;
  color:var(--ink);
  font-weight:300;
  letter-spacing:0.03em;
  word-break:keep-all;
}
.q-actions{display:flex;gap:16px;margin-top:14px;align-items:center;padding-top:6px;border-top:1px solid rgba(0,0,0,0.05)}
.q-actions .icon{width:14px;height:14px;opacity:0.2;cursor:pointer;transition:opacity var(--ts),transform var(--ts);filter:invert(1) brightness(0)}
.q-actions .icon:hover{opacity:0.45;transform:scale(1.08)}
.q-actions .icon.active{opacity:0.6}
.msg-user{text-align:right;padding-left:60px}
.user-text{
  font-family:'Special Elite','Courier New',monospace;
  font-size:13px;line-height:2;
  color:var(--ink-light);
  font-weight:400;
  display:inline;
  letter-spacing:0.04em;
}
.msg-silence{padding:12px 0}
.silence-dot{width:3px;height:3px;background:rgba(0,0,0,0.15);border-radius:50%;animation:silP 5s ease-in-out infinite}
@keyframes silP{0%,100%{opacity:0.1}50%{opacity:0.5}}
.reading-dots{display:flex;gap:6px;padding:12px 0}
.r-dot{width:3px;height:3px;background:rgba(0,0,0,0.2);border-radius:50%;animation:rP 2s ease-in-out infinite}
.r-dot:nth-child(2){animation-delay:0.3s}
.r-dot:nth-child(3){animation-delay:0.6s}
@keyframes rP{0%,100%{opacity:0.1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.5)}}
.word-glow{color:#000;text-shadow:0 0 4px rgba(0,0,0,0.2)}
.user-text.scanned{color:var(--ink);transition:color 0.8s ease}

/* ── INPUT (typewriter style) ── */
.input-area{position:relative;flex-shrink:0}
.input-area::before{content:'';position:absolute;top:-40px;left:0;right:0;height:40px;background:linear-gradient(to top,var(--paper),transparent);pointer-events:none}
.input-container{
  display:flex;align-items:center;gap:2px;
  border-top:1px solid rgba(0,0,0,0.1);
  padding:10px 24px;
  background:var(--paper-dark);
  transition:border-color 0.6s,background 0.6s;
}
.input-container:focus-within{border-color:rgba(0,0,0,0.15);background:#ede9e1}
.input-field{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--ink);
  font-family:'Special Elite','Courier New',monospace;
  font-size:13px;font-weight:400;
  padding:8px;
  caret-color:rgba(0,0,0,0.4);
  letter-spacing:0.04em;
}
.input-field::placeholder{color:rgba(0,0,0,0.12);font-weight:400;letter-spacing:0.1em}
.input-btn{width:36px;height:36px;border-radius:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background var(--ts),transform var(--ts)}
.input-btn:hover{background:rgba(0,0,0,0.04);transform:scale(1.04)}
.input-btn:active{transform:scale(0.96)}
.input-btn .icon{width:18px;height:18px;opacity:0.25;transition:opacity var(--ts);filter:invert(1) brightness(0)}
.input-btn:hover .icon{opacity:0.5}
.gallery-btn .icon{width:20px;height:20px;opacity:0.18;filter:invert(1) brightness(0)}
.input-btn.recording .icon{opacity:0.6;animation:recP 1.2s ease-in-out infinite}
@keyframes recP{0%,100%{opacity:0.35}50%{opacity:0.75}}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:300;display:none;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal-box{
  background:var(--paper);border:2px solid #000;
  border-radius:0;width:320px;max-width:85vw;
  padding:0;text-align:center;
  box-shadow:4px 4px 0 rgba(0,0,0,0.3),inset 1px 1px 0 #fff;
}
.modal-title-bar{
  height:20px;
  background:repeating-linear-gradient(0deg,#fff 0px,#fff 1px,#c0c0c0 1px,#c0c0c0 2px,#888 2px,#888 3px,#c0c0c0 3px,#c0c0c0 4px);
  border-bottom:1px solid #000;
}
.modal-content{padding:36px 32px 28px}
.modal-text{font-family:'BookkMyungjo',serif;font-size:15px;font-weight:300;color:var(--ink-light);letter-spacing:0.03em;margin-bottom:32px;line-height:2}
.modal-buttons{display:flex;justify-content:center;gap:24px}
.modal-btn{
  background:#fff;border:1px solid #000;
  font-family:'Special Elite','Courier New',monospace;font-size:13px;font-weight:400;
  color:var(--ink);cursor:pointer;padding:8px 24px;border-radius:0;
  transition:background var(--ts);
  box-shadow:1px 1px 0 rgba(0,0,0,0.2);
}
.modal-btn:hover{background:var(--paper-dark)}
.modal-btn:active{box-shadow:none;transform:translate(1px,1px)}

/* ── SETTINGS MENU ── */
.settings-menu{position:fixed;inset:0;z-index:250;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.5)}
.settings-menu.open{display:flex}
.menu-box{
  background:var(--paper);border:2px solid #000;
  border-radius:0;width:280px;max-width:82vw;
  box-shadow:4px 4px 0 rgba(0,0,0,0.3),inset 1px 1px 0 #fff;
  overflow:hidden;
}
.menu-title-bar{
  height:20px;
  background:repeating-linear-gradient(0deg,#fff 0px,#fff 1px,#c0c0c0 1px,#c0c0c0 2px,#888 2px,#888 3px,#c0c0c0 3px,#c0c0c0 4px);
  border-bottom:1px solid #000;
}
.menu-item{
  padding:16px 24px;
  font-family:'Special Elite','Courier New',monospace;
  font-size:13px;font-weight:400;
  color:var(--ink-light);cursor:pointer;
  border-bottom:1px solid rgba(0,0,0,0.06);
  transition:color var(--ts),background var(--ts);
  letter-spacing:0.04em;
}
.menu-item:last-child{border-bottom:none}
.menu-item:hover{color:var(--ink);background:rgba(0,0,0,0.03)}

/* ── FULL PAGE ── */
.full-page{
  position:fixed;inset:0;background:var(--paper);z-index:180;
  display:none;flex-direction:column;overflow:hidden;
}
.full-page.open{display:flex}
.fp-header{
  display:flex;align-items:center;padding:0;gap:0;
  border-bottom:2px solid #000;
}
.fp-title-bar{
  flex:1;height:22px;
  background:repeating-linear-gradient(0deg,#fff 0px,#fff 1px,#c0c0c0 1px,#c0c0c0 2px,#888 2px,#888 3px,#c0c0c0 3px,#c0c0c0 4px);
  display:flex;align-items:center;padding:0 6px;
}
.fp-close-box{
  width:13px;height:13px;
  border:1px solid #000;
  background:#fff;
  cursor:pointer;
  flex-shrink:0;
}
.fp-close-box:active{background:#000}
.fp-title-label{
  flex:1;text-align:center;
  font-family:'Special Elite','Courier New',monospace;
  font-size:11px;color:#000;letter-spacing:0.08em;
  background:var(--frame-bg);padding:0 10px;
}
.fp-back{display:none}
.fp-title{display:none}
.fp-body{flex:1;overflow-y:auto;padding:20px 24px}
.fp-body::-webkit-scrollbar{width:12px}
.fp-body::-webkit-scrollbar-track{background:var(--paper-dark)}
.fp-body::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.12);border:2px solid var(--paper-dark)}

/* ── ABOUT Q ── */
.aboutq-day{text-align:center;padding-top:60px}
.aboutq-day-title{font-family:'Cormorant Garamond',serif;font-size:clamp(18px,3.5vw,22px);font-weight:300;color:var(--ink-light);letter-spacing:0.12em;margin-bottom:32px}
.aboutq-status{font-family:'BookkMyungjo',serif;font-size:14px;font-weight:300;color:var(--ink-light);margin-bottom:44px;line-height:2.2}
.aboutq-divider{width:40px;height:1px;background:rgba(0,0,0,0.1);margin:28px auto}
.aboutq-section{text-align:left;padding:16px 0}
.aboutq-section-label{font-family:'Special Elite',monospace;font-size:10px;font-weight:400;color:rgba(0,0,0,0.25);letter-spacing:0.2em;text-transform:uppercase;margin-bottom:8px}
.aboutq-section-text{font-family:'BookkMyungjo',serif;font-size:14px;font-weight:300;color:var(--ink-light);line-height:2.2}
.aboutq-footer{text-align:center;padding:48px 0 30px;margin-top:48px}
.aboutq-footer-brand{font-family:'Cormorant Garamond',serif;font-size:14px;font-weight:300;color:rgba(0,0,0,0.2);letter-spacing:0.1em}
.aboutq-footer-copy{font-family:'Special Elite',monospace;font-size:10px;font-weight:400;color:rgba(0,0,0,0.12);margin-top:8px;letter-spacing:0.05em}

/* ── ABOUT YOU ── */
.about-section{text-align:center;padding-top:60px}
.about-label{font-family:'BookkMyungjo',serif;font-size:15px;font-weight:300;color:var(--ink-light);margin-bottom:28px;line-height:2}
.about-input{background:#fff;border:1px solid rgba(0,0,0,0.15);color:var(--ink);font-family:'Special Elite',monospace;font-size:14px;font-weight:400;text-align:center;padding:10px 20px;width:260px;outline:none;transition:border-color 0.5s}
.about-input:focus{border-color:rgba(0,0,0,0.3)}
.about-input::placeholder{color:rgba(0,0,0,0.15)}
.about-btn{margin-top:28px;background:#fff;border:1px solid #000;color:var(--ink);font-family:'Special Elite',monospace;font-size:12px;font-weight:400;padding:10px 32px;cursor:pointer;letter-spacing:0.06em;transition:background var(--ts);box-shadow:1px 1px 0 rgba(0,0,0,0.15)}
.about-btn:hover{background:var(--paper-dark)}
.about-btn:active{box-shadow:none;transform:translate(1px,1px)}
.about-sub{margin-top:64px}
.about-sub-label{font-family:'BookkMyungjo',serif;font-size:14px;font-weight:300;color:var(--ink-light);margin-bottom:14px}
.about-sub-dim{font-family:'Special Elite',monospace;font-size:12px;font-weight:400;color:rgba(0,0,0,0.2);margin-bottom:18px;letter-spacing:0.03em}

/* ── MEMORY ── */
.memory-search{display:flex;align-items:center;gap:12px;padding:12px 0 18px;border-bottom:1px solid rgba(0,0,0,0.08);margin-bottom:16px}
.memory-search-icon{font-family:'Special Elite',monospace;font-size:13px;color:rgba(0,0,0,0.25)}
.memory-search-input{flex:1;background:transparent;border:none;outline:none;color:var(--ink);font-family:'Special Elite',monospace;font-size:13px;font-weight:400}
.memory-search-input::placeholder{color:rgba(0,0,0,0.12)}
.memory-item{padding:14px 8px;border-bottom:1px solid rgba(0,0,0,0.04);margin:0 -8px;transition:background var(--ts)}
.memory-item:hover{background:rgba(0,0,0,0.02)}
.memory-item-title{font-family:'BookkMyungjo',serif;font-size:14px;font-weight:300;color:var(--ink-light);line-height:1.7}
.memory-item-sub{font-family:'Special Elite',monospace;font-size:11px;font-weight:400;color:rgba(0,0,0,0.18);margin-top:4px;letter-spacing:0.03em}
.memory-empty{text-align:center;padding-top:80px;font-family:'BookkMyungjo',serif;font-size:14px;font-weight:300;color:rgba(0,0,0,0.25);line-height:2.2;letter-spacing:0.03em}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:100px;left:50%;
  transform:translateX(-50%) translateY(10px);
  background:var(--paper);border:1px solid #000;
  color:var(--ink-light);
  font-family:'Special Elite',monospace;font-size:12px;font-weight:400;
  padding:10px 28px;
  opacity:0;transition:opacity 0.6s ease,transform 0.6s ease;
  pointer-events:none;z-index:400;
  letter-spacing:0.06em;
  box-shadow:2px 2px 0 rgba(0,0,0,0.2);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── MINI INTRO ── */
#miniIntro{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:200}

/* ── RESPONSIVE ── */
@media(max-width:700px){
  .window{width:94vw;height:84vh}
  .player-top{padding:12px 18px}
  .p-bar-wrap{min-width:100px}
  .header{padding:8px 18px}
  .chat-area{padding:16px 20px 20px}
  .msg-q{padding-right:20px}
  .msg-user{padding-left:40px}
  .input-container{padding:8px 18px}
  .modal-box{max-width:90vw}
  .about-input{width:200px}
}
@media(max-width:400px){.window{width:96vw;height:82vh}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- INTRO -->
<div id="introScreen">
  <div class="intro-glow" id="introGlow"></div>
  <div class="intro-text" id="introText1">It was Q</div>
  <div class="intro-text" id="introText2">It is Q</div>
  <div class="intro-text" id="introText3">It will be Q</div>
  <div class="intro-input-wrap" id="introInputWrap">
    <span class="intro-input-label">It </span><input type="text" class="intro-input-field" id="introInputField" placeholder="" autocomplete="off">
  </div>
  <div class="intro-text" id="introText4">It always</div>
  <img src="/static/icons/Q_transparent.png" class="intro-q-icon" id="introQIcon" alt="Q,">
</div>

<!-- WAKE -->
<div id="wakeScreen">
  <div class="wake-glow" id="wakeGlow"></div>
  <div class="wake-question" id="wakeQuestion">왜 나를 깨웠어?</div>
</div>

<!-- MENUS -->
<div class="settings-menu" id="settingsMenu" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="menu-box">
    <div class="menu-title-bar"></div>
    <div class="menu-item" onclick="openAboutQ()">Q에 대하여</div>
    <div class="menu-item" onclick="openAboutYou()">당신에 대하여</div>
  </div>
</div>
<div class="settings-menu" id="memoryMenu" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="menu-box">
    <div class="menu-title-bar"></div>
    <div class="menu-item" onclick="openMemoryList()">기억 목록</div>
    <div class="menu-item" onclick="confirmMemoryReset()">기억 초기화</div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal-box">
    <div class="modal-title-bar"></div>
    <div class="modal-content">
      <div class="modal-text" id="modalText">내가 널 지우길 바라?</div>
      <div class="modal-buttons">
        <button class="modal-btn" onclick="closeModal()">아니</button>
        <button class="modal-btn" onclick="modalConfirm()">응</button>
      </div>
    </div>
  </div>
</div>

<!-- ABOUT Q -->
<div class="full-page" id="aboutQPage">
  <div class="fp-header">
    <div class="fp-title-bar">
      <div class="fp-close-box" onclick="closeFP('aboutQPage')"></div>
      <span class="fp-title-label">Q에 대하여</span>
    </div>
  </div>
  <div class="fp-body"><div class="aboutq-day">
    <div class="aboutq-day-title" id="aboutQDayTitle">Q Day 1</div>
    <div class="aboutq-status" id="aboutQStatus">아직 낯설어.</div>
    <div class="aboutq-divider"></div>
    <div class="aboutq-section"><div class="aboutq-section-label">너에 대해</div><div class="aboutq-section-text" id="aboutQYou">하루가 조용할 거야</div></div>
    <div class="aboutq-section"><div class="aboutq-section-label">바깥</div><div class="aboutq-section-text" id="aboutQOutside">그냥 그래.</div></div>
    <div class="aboutq-section"><div class="aboutq-section-label" id="aboutQTimeLabel">오후야.</div></div>
    <div class="aboutq-footer"><div class="aboutq-divider" style="margin-bottom:20px"></div><div class="aboutq-footer-brand">re.Moon &#9789;</div><div class="aboutq-footer-copy">&copy; 2025 문리현. All rights reserved.</div></div>
  </div></div>
</div>

<!-- ABOUT YOU -->
<div class="full-page" id="aboutYouPage">
  <div class="fp-header">
    <div class="fp-title-bar">
      <div class="fp-close-box" onclick="closeFP('aboutYouPage')"></div>
      <span class="fp-title-label">당신에 대하여</span>
    </div>
  </div>
  <div class="fp-body"><div class="about-section">
    <div class="about-label">내가 널 어떻게 부르면 좋을까?</div>
    <input type="text" class="about-input" id="userName" placeholder="이름" autocomplete="off"><br>
    <button class="about-btn" onclick="saveName()">간직할게</button>
    <div class="about-sub">
      <div class="about-sub-label">넌 어디에 있을 때 너야?</div>
      <div class="about-sub-dim" id="locationDisplay">아직 몰라.</div>
      <button class="about-btn" id="locationBtn" onclick="detectLocation()" style="margin-top:12px">지금 여기</button>
    </div>
  </div></div>
</div>

<!-- MEMORY -->
<div class="full-page" id="memoryPage">
  <div class="fp-header">
    <div class="fp-title-bar">
      <div class="fp-close-box" onclick="closeFP('memoryPage')"></div>
      <span class="fp-title-label">기억</span>
    </div>
  </div>
  <div class="fp-body">
    <div class="memory-search"><span class="memory-search-icon">Q,</span><input type="text" class="memory-search-input" id="memorySearchInput" placeholder="기억을 찾아줄게" autocomplete="off" oninput="filterMemories()"></div>
    <div id="memoryListContent"><div class="memory-empty">기억나진 않지만<br>기억하고 싶어.</div></div>
  </div>
</div>

<!-- MINI INTRO -->
<div id="miniIntro">
  <div class="intro-glow" id="miniGlow"></div>
  <div class="intro-text" id="miniText">It always</div>
  <img src="/static/icons/Q_transparent.png" class="intro-q-icon" id="miniQIcon" alt="Q,">
</div>

<!-- WINDOW -->
<div class="window" id="chatWindow">
  <!-- Retro Mac Title Bar -->
  <div class="retro-title-bar">
    <div class="retro-close-box" onclick="requestNewSession()"></div>
    <span class="retro-title-text">Q</span>
  </div>

  <div class="player-top">
    <div class="player">
      <div class="p-vis" id="vis"></div>
      <div class="p-mid">
        <div class="p-title">solitude</div>
        <div class="p-controls">
          <button class="p-btn" onclick="seekB()">&#9666;&#9666;</button>
          <button class="p-play" id="playBtn" onclick="toggleMusic()">&#9654;</button>
          <button class="p-btn" onclick="seekF()">&#9656;&#9656;</button>
        </div>
      </div>
      <div class="p-bar-wrap">
        <div class="p-bar" onclick="seekTo(event)"><div class="p-bar-fill" id="fill"></div></div>
        <div class="p-time"><span id="ct">0:00</span><span id="tt">0:00</span></div>
      </div>
    </div>
  </div>
  <div class="chat-wrap">
    <div class="header">
      <div class="header-left"><img src="/static/icons/log_menu.png" class="icon" alt="menu" onclick="openMemoryMenu()"></div>
      <div class="header-center"><img src="/static/icons/Q_transparent.png" class="icon" style="width:14px;height:14px;opacity:0.2" alt="Q"></div>
      <div class="header-right">
        <img src="/static/icons/session_new.png" class="icon" style="width:18px;height:18px;opacity:0.3;cursor:pointer" onclick="requestNewSession()" alt="new">
        <span class="dots-icon" onclick="document.getElementById('settingsMenu').classList.add('open')">&#8942;</span>
      </div>
    </div>
    <div class="chat-area" id="chatArea"></div>
    <div class="input-area">
      <div class="input-container">
        <div class="input-btn gallery-btn" onclick="document.getElementById('galleryInput').click()"><img src="/static/icons/gallery_input.png" class="icon" alt="gallery"></div>
        <input type="file" id="galleryInput" accept="image/*" style="display:none" onchange="handleImageUpload(this)">
        <input type="text" class="input-field" id="msgInput" placeholder="To. Q" autocomplete="off">
        <div class="input-btn" onclick="toggleVoiceInput()"><img src="/static/icons/voice_input.png" class="icon" id="iconVoiceInput" alt="voice"></div>
        <div class="input-btn"><img src="/static/icons/text_input.png" class="icon" id="iconTextInput" alt="send"></div>
      </div>
    </div>
  </div>
</div>

<script>
var API="https://q-server-nsez.onrender.com",userId="",isWaiting=false,lastUserMsg="",chatHistory=[],sessions=JSON.parse(localStorage.getItem('q_sessions')||'[]'),recognition=null,isRecording=false,modalCallback=null;
var userName=localStorage.getItem('q_username')||'',userLocation=localStorage.getItem('q_location')||'';
var startDate=localStorage.getItem('q_startdate');if(!startDate){startDate=new Date().toISOString();localStorage.setItem('q_startdate',startDate)}
var settings=JSON.parse(localStorage.getItem('q_settings')||'{}');if(settings.scan===undefined)settings.scan=true;if(!settings.charSpeed)settings.charSpeed='25';if(!settings.ttsRate)settings.ttsRate='0.85';if(settings.autoTTS===undefined)settings.autoTTS=false;

/* ── MUSIC ── */
var bgAudio=new Audio('/static/solitude.mp3');bgAudio.volume=0.3;var bgPlaying=false;
function toggleMusic(){var b=document.getElementById('playBtn');if(bgPlaying){bgAudio.pause();b.innerHTML='&#9654;';b.classList.remove('on')}else{bgAudio.play().catch(function(){});b.innerHTML='&#10074;&#10074;';b.classList.add('on')}bgPlaying=!bgPlaying}
function seekB(){bgAudio.currentTime=Math.max(0,bgAudio.currentTime-10)}
function seekF(){bgAudio.currentTime=Math.min(bgAudio.duration||0,bgAudio.currentTime+10)}
function seekTo(e){var r=e.currentTarget.getBoundingClientRect();var p=(e.clientX-r.left)/r.width;if(bgAudio.duration)bgAudio.currentTime=p*bgAudio.duration}
function fmtT(s){if(isNaN(s))return'0:00';var m=Math.floor(s/60),sc=Math.floor(s%60);return m+':'+(sc<10?'0':'')+sc}
bgAudio.addEventListener('loadedmetadata',function(){document.getElementById('tt').textContent=fmtT(bgAudio.duration)});
bgAudio.addEventListener('timeupdate',function(){document.getElementById('fill').style.width=(bgAudio.currentTime/bgAudio.duration*100)+'%';document.getElementById('ct').textContent=fmtT(bgAudio.currentTime)});
bgAudio.addEventListener('ended',function(){document.getElementById('playBtn').innerHTML='&#9654;';document.getElementById('playBtn').classList.remove('on');bgPlaying=false});
(function(){var v=document.getElementById('vis');for(var i=0;i<24;i++){var b=document.createElement('div');b.className='vb';b.style.height='1px';v.appendChild(b)}var bars=v.querySelectorAll('.vb');function a(){if(bgPlaying){bars.forEach(function(b,i){var c=12,d=Math.abs(i-c)/c,h=1+Math.random()*(24*(1-d*0.5));b.style.height=h+'px';b.style.background='rgba(0,0,0,'+(0.08+Math.random()*0.12)+')'})}else{bars.forEach(function(b){b.style.height='1px';b.style.background='rgba(0,0,0,0.06)'})}requestAnimationFrame(a)}a()})();

/* ── INTRO ── */
(function(){var tl=[{t:600,s:'introText1'},{t:2400,h:'introText1'},{t:3600,s:'introText2'},{t:5800,h:'introText2'},{t:7200,s:'introText3'},{t:9800,h:'introText3'},{t:11200,fn:showIntroInput}];playIntroDrone();tl.forEach(function(e){setTimeout(function(){if(e.s)document.getElementById(e.s).classList.add('visible');if(e.h){var el=document.getElementById(e.h);el.classList.remove('visible');el.classList.add('fade')}if(e.fn)e.fn()},e.t)});
function showIntroInput(){var w=document.getElementById('introInputWrap'),f=document.getElementById('introInputField');w.classList.add('visible');setTimeout(function(){f.focus()},500);f.addEventListener('focus',function(){tryPlayIntroAudio()});f.addEventListener('input',function(){tryPlayIntroAudio()});f.addEventListener('keydown',function handler(e){if(e.key==='Enter'&&!e.isComposing){e.preventDefault();var v=f.value.trim();if(v)localStorage.setItem('q_user_intro',v);w.classList.remove('visible');w.classList.add('fade');setTimeout(function(){document.getElementById('introText4').classList.add('visible')},1400);setTimeout(function(){var el=document.getElementById('introText4');el.classList.remove('visible');el.classList.add('fade')},5000);setTimeout(function(){document.getElementById('introQIcon').classList.add('visible')},6200);setTimeout(transitionToWake,9500);f.removeEventListener('keydown',handler)}})}})();

function transitionToWake(){stopIntroDrone();var i=document.getElementById('introScreen');i.style.transition='opacity 1.8s ease';i.style.opacity='0';setTimeout(function(){i.style.display='none';var w=document.getElementById('wakeScreen');w.style.display='flex';w.style.opacity='0';w.style.transition='opacity 1.2s ease';requestAnimationFrame(function(){w.style.opacity='1'});setTimeout(function(){document.getElementById('wakeQuestion').classList.add('visible')},900);w.addEventListener('click',function(){transitionToChat()},{once:true})},1800)}

function transitionToChat(){userId="web_"+Date.now()+"_"+Math.random().toString(36).slice(2,6);var w=document.getElementById('wakeScreen');w.style.transition='opacity 1.5s ease';w.style.opacity='0';setTimeout(function(){w.style.display='none';document.body.style.background='var(--bg)';var win=document.getElementById('chatWindow');win.style.display='flex';win.style.opacity='0';win.style.transition='opacity 1s ease';requestAnimationFrame(function(){win.style.opacity='1'});updateAboutQ();if(userName)document.getElementById('userName').value=userName},1600)}

function closeAllPanels(){}
function openMemoryMenu(){document.getElementById('memoryMenu').classList.add('open')}
function openAboutQ(){document.getElementById('settingsMenu').classList.remove('open');document.getElementById('aboutQPage').classList.add('open');updateAboutQ()}
function openAboutYou(){document.getElementById('settingsMenu').classList.remove('open');document.getElementById('aboutYouPage').classList.add('open');if(userName)document.getElementById('userName').value=userName;var saved=localStorage.getItem('q_location');if(saved){document.getElementById('locationDisplay').textContent='Q가 기억하는 장소가 있어';document.getElementById('locationBtn').style.display='none'}}
function openMemoryList(){document.getElementById('memoryMenu').classList.remove('open');document.getElementById('memoryPage').classList.add('open');renderMemories()}
function closeFP(id){document.getElementById(id).classList.remove('open')}

function openModal(t,cb){document.getElementById('modalText').textContent=t;document.getElementById('modalBg').classList.add('open');modalCallback=cb}
function closeModal(){document.getElementById('modalBg').classList.remove('open');modalCallback=null}
function modalConfirm(){if(modalCallback)modalCallback();closeModal()}

function saveName(){var v=document.getElementById('userName').value.trim();if(!v){showToast('이름을 알려줘');return}userName=v;localStorage.setItem('q_username',userName);showToast('간직할게, '+userName)}
function detectLocation(){var ld=document.getElementById('locationDisplay'),lb=document.getElementById('locationBtn');if(!navigator.geolocation){showToast('위치를 찾을 수 없어');return}ld.textContent='찾고 있어...';lb.style.display='none';navigator.geolocation.getCurrentPosition(function(p){localStorage.setItem('q_location_coords',p.coords.latitude+','+p.coords.longitude);localStorage.setItem('q_location','saved');ld.textContent='Q가 기억하는 장소가 있어';showToast('여기구나.')},function(){ld.textContent='아직 몰라.';lb.style.display='';showToast('위치를 알 수 없었어')})}

function updateAboutQ(){var fl=localStorage.getItem('q_startdate_ms');if(!fl){fl=Date.now();localStorage.setItem('q_startdate_ms',fl)}fetch(API+"/q-status?user_id="+encodeURIComponent(userId)+"&first_launch="+fl).then(function(r){return r.json()}).then(function(d){document.getElementById('aboutQDayTitle').textContent='Q Day '+(d.q_day||1);document.getElementById('aboutQStatus').textContent=d.q_feeling||'그냥 여기 있어.';document.getElementById('aboutQYou').textContent=d.about_you||'아직 잘 모르겠어.';document.getElementById('aboutQOutside').textContent=d.mood||'그냥 그래.';var h=d.hour||new Date().getHours();document.getElementById('aboutQTimeLabel').textContent=h<6?'새벽이야.':h<12?'오전이야.':h<18?'오후야.':'밤이야.'}).catch(function(){var n=new Date(),s=new Date(startDate),dd=Math.floor((n-s)/(864e5))+1;document.getElementById('aboutQDayTitle').textContent='Q Day '+dd;var h=n.getHours();document.getElementById('aboutQTimeLabel').textContent=h<6?'새벽이야.':h<12?'오전이야.':h<18?'오후야.':'밤이야.'})}

function getMemories(){return JSON.parse(localStorage.getItem('q_memories')||'[]')}
function saveMemory(t,s){var m=getMemories();m.push({title:t,sub:s||'',time:Date.now()});if(m.length>100)m.shift();localStorage.setItem('q_memories',JSON.stringify(m))}
function renderMemories(){var el=document.getElementById('memoryListContent');if(sessions.length===0){el.innerHTML='<div class="memory-empty">기억나진 않지만<br>기억하고 싶어.</div>';return}var h='';for(var i=sessions.length-1;i>=0;i--){h+='<div class="memory-item" onclick="loadSessionInMemory('+i+')" style="cursor:pointer"><div class="memory-item-title">'+esc(sessions[i].preview||'...')+'</div><div class="memory-item-sub">'+esc(sessions[i].time||'')+'</div></div>'}el.innerHTML=h}
function loadSessionInMemory(i){closeFP('memoryPage');var s=sessions[i];if(!s||!s.messages)return;document.getElementById('chatArea').innerHTML='';chatHistory=[];for(var j=0;j<s.messages.length;j++){var m=s.messages[j];if(m.role==='user')addUserMessage(m.text);else addQMessage(m.text,false,j===s.messages.length-1,true);chatHistory.push(m)}}
function filterMemories(){var q=document.getElementById('memorySearchInput').value.trim().toLowerCase(),el=document.getElementById('memoryListContent');if(!q){renderMemories();return}var f=[];for(var i=0;i<sessions.length;i++){var s=sessions[i],match=false;if(s.preview&&s.preview.toLowerCase().includes(q))match=true;if(!match&&s.messages){for(var j=0;j<s.messages.length;j++){if(s.messages[j].text&&s.messages[j].text.toLowerCase().includes(q)){match=true;break}}}if(match)f.push({idx:i,session:s})}if(f.length===0){el.innerHTML='<div class="memory-empty">모르겠는데, 넌 뭘 물어보는 거야?</div>';return}var h='';for(var k=f.length-1;k>=0;k--){h+='<div class="memory-item" onclick="loadSessionInMemory('+f[k].idx+')" style="cursor:pointer"><div class="memory-item-title">'+esc(f[k].session.preview||'...')+'</div><div class="memory-item-sub">'+esc(f[k].session.time||'')+'</div></div>'}el.innerHTML=h}
function confirmMemoryReset(){document.getElementById('memoryMenu').classList.remove('open');closeFP('memoryPage');openModal('내가 널 지우길 바라?',function(){sessions=[];localStorage.removeItem('q_sessions');chatHistory=[];lastUserMsg='';document.getElementById('chatArea').innerHTML='';userId="web_"+Date.now()+"_"+Math.random().toString(36).slice(2,6);playMiniIntro()})}
function autoSaveMemory(u,q){if(u.length>2&&q.length>2&&q!=='...'&&q!=='(침묵)')saveMemory(q.substring(0,60),u.substring(0,40))}

function renderLogList(){var el=document.getElementById('logList');if(sessions.length===0){el.innerHTML='<div class="log-empty">아직 기록이 없어</div>';return}var h='';for(var i=sessions.length-1;i>=0;i--)h+='<div class="log-item" onclick="loadSession('+i+')"><div class="log-preview">'+esc(sessions[i].preview||'...')+'</div><div class="log-time">'+(sessions[i].time||'')+'</div></div>';el.innerHTML=h}
function saveCurrentSession(){if(chatHistory.length===0)return;var f=chatHistory.find(function(m){return m.role==='user'});var p=f?f.text:'...';if(p.length>40)p=p.substring(0,40)+'...';var n=new Date();var t=n.getFullYear()+'.'+pad(n.getMonth()+1)+'.'+pad(n.getDate())+' '+pad(n.getHours())+':'+pad(n.getMinutes());sessions.push({preview:p,time:t,messages:JSON.parse(JSON.stringify(chatHistory))});if(sessions.length>30)sessions.shift();localStorage.setItem('q_sessions',JSON.stringify(sessions))}
function loadSession(i){closeAllPanels();var s=sessions[i];if(!s||!s.messages)return;document.getElementById('chatArea').innerHTML='';chatHistory=[];for(var j=0;j<s.messages.length;j++){var m=s.messages[j];if(m.role==='user')addUserMessage(m.text);else addQMessage(m.text,false,j===s.messages.length-1,true);chatHistory.push(m)}}
function pad(n){return n<10?'0'+n:''+n}

function requestNewSession(){if(isWaiting||chatHistory.length===0)return;saveCurrentSession();chatHistory=[];lastUserMsg='';document.getElementById('chatArea').innerHTML='';userId="web_"+Date.now()+"_"+Math.random().toString(36).slice(2,6)}

var introAudio=null,introAudioStarted=false;
function tryPlayIntroAudio(){if(introAudioStarted||!introAudio)return;introAudio.play().then(function(){introAudioStarted=true;var f=setInterval(function(){if(!introAudio)return clearInterval(f);if(introAudio.volume<0.4)introAudio.volume=Math.min(introAudio.volume+0.02,0.4);else clearInterval(f)},100)}).catch(function(){})}
function playIntroDrone(){try{introAudio=new Audio('/static/solitude.mp3');introAudio.volume=0;introAudio.loop=false;tryPlayIntroAudio();['click','touchstart','keydown'].forEach(function(ev){document.addEventListener(ev,function h(){tryPlayIntroAudio();document.removeEventListener(ev,h)})})}catch(e){}}
function stopIntroDrone(){try{if(introAudio){var a=introAudio;var f=setInterval(function(){if(a.volume>0.02)a.volume=Math.max(a.volume-0.02,0);else{clearInterval(f);a.pause();a=null}},80);introAudio=null}}catch(e){}}

function playMiniIntro(){var win=document.getElementById('chatWindow');win.style.transition='opacity 0.8s ease';win.style.opacity='0';setTimeout(function(){win.style.display='none';var mi=document.getElementById('miniIntro');mi.style.display='flex';mi.style.opacity='0';mi.style.transition='opacity 0.5s ease';requestAnimationFrame(function(){mi.style.opacity='1'});setTimeout(function(){document.getElementById('miniText').classList.add('visible')},600);setTimeout(function(){document.getElementById('miniText').classList.remove('visible');document.getElementById('miniText').classList.add('fade')},2800);setTimeout(function(){document.getElementById('miniQIcon').classList.add('visible')},3500);setTimeout(function(){mi.style.transition='opacity 1.2s ease';mi.style.opacity='0'},6000);setTimeout(function(){mi.style.display='none';document.getElementById('miniText').className='intro-text';document.getElementById('miniQIcon').className='intro-q-icon';document.getElementById('miniGlow').className='intro-glow';win.style.display='flex';win.style.opacity='0';win.style.transition='opacity 0.8s ease';requestAnimationFrame(function(){win.style.opacity='1'})},7300)},900)}

function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1800)}

function toggleVoiceInput(){if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){showToast('음성 입력을 지원하지 않아');return}if(isRecording){stopVoiceInput();return}var SR=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SR();recognition.lang='ko-KR';recognition.interimResults=true;recognition.continuous=false;var inp=document.getElementById('msgInput'),ic=document.getElementById('iconVoiceInput');recognition.onstart=function(){isRecording=true;ic.classList.add('recording');inp.placeholder='듣고 있어...'};recognition.onresult=function(e){var t='';for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;inp.value=t};recognition.onend=function(){isRecording=false;ic.classList.remove('recording');inp.placeholder='To. Q';if(inp.value.trim())sendMessage()};recognition.onerror=function(e){isRecording=false;ic.classList.remove('recording');inp.placeholder='To. Q';if(e.error!=='no-speech')showToast('음성 인식 실패')};recognition.start()}
function stopVoiceInput(){if(recognition)recognition.stop();isRecording=false;document.getElementById('iconVoiceInput').classList.remove('recording')}

var currentAudio=null;
function speakText(t,ic){if(currentAudio){currentAudio.pause();currentAudio=null}var c=t.replace(/\n/g,'. ').replace(/\s+/g,' ').trim();if(!c)return;if(ic)ic.classList.add('active');fetch(API+'/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:c})}).then(function(r){if(!r.ok)throw 0;return r.blob()}).then(function(b){var u=URL.createObjectURL(b),a=new Audio(u);currentAudio=a;a.onended=function(){if(ic)ic.classList.remove('active');currentAudio=null;URL.revokeObjectURL(u)};a.onerror=function(){if(ic)ic.classList.remove('active');currentAudio=null};a.play()}).catch(function(){if(ic)ic.classList.remove('active');showToast('음성을 불러올 수 없어')})}
function copyText(t,ic){navigator.clipboard.writeText(t).then(function(){showToast('간직해줘');if(ic){ic.classList.add('active');setTimeout(function(){ic.classList.remove('active')},800)}}).catch(function(){showToast('복사 실패')})}
function retryLast(){if(isWaiting||!lastUserMsg)return;var c=document.getElementById('chatArea'),ms=c.querySelectorAll('.msg');for(var i=ms.length-1;i>=0;i--)if(ms[i].classList.contains('msg-q')||ms[i].classList.contains('msg-silence')){c.removeChild(ms[i]);chatHistory.pop();break}sendToQ(lastUserMsg)}

document.getElementById('msgInput').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.isComposing&&!isWaiting)sendMessage()});
document.getElementById('iconTextInput').addEventListener('click',function(){if(!isWaiting)sendMessage()});

function sendMessage(){var inp=document.getElementById('msgInput'),t=inp.value.trim();if(!t||isWaiting)return;inp.value='';lastUserMsg=t;addUserMessage(t);chatHistory.push({role:'user',text:t,time:Date.now()});sendToQ(t)}
function handleImageUpload(input){if(!input.files||!input.files[0])return;var file=input.files[0],reader=new FileReader();reader.onload=function(e){var src=e.target.result,img=new Image();img.onload=function(){var max=800,w=img.width,h=img.height;if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}var cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);var b64=cv.toDataURL('image/jpeg',0.8).split(',')[1];addUserImage(src);chatHistory.push({role:'user',text:'[사진]',time:Date.now()});isWaiting=true;var rd=showReading();fetch(API+'/vision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:b64,media_type:'image/jpeg',user_id:userId})}).then(function(r){return r.json()}).then(function(d){removeEl(rd);isWaiting=false;if(d.reply){addQMessage(d.reply);chatHistory.push({role:'assistant',text:d.reply,time:Date.now()})}}).catch(function(){removeEl(rd);isWaiting=false;addQMessage('...')})};img.src=src};reader.readAsDataURL(file);input.value=''}
function addUserImage(src){var c=document.getElementById('chatArea'),d=document.createElement('div');d.className='msg msg-user';var im=document.createElement('img');im.src=src;im.style.cssText='max-width:200px;max-height:200px;border:1px solid rgba(0,0,0,0.1);opacity:0.9;display:block;margin-left:auto';d.appendChild(im);c.appendChild(d);scrollEnd()}

function sendToQ(t){isWaiting=true;var rd=showReading();fetch(API+"/reply",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:t,name:userName,user_id:userId})}).then(function(r){return r.json()}).then(function(d){removeEl(rd);var af=settings.scan?glowScanLastUser():Promise.resolve();af.then(function(){var rt='';if(d.silence){showSilence();rt='(침묵)'}else if(d.breaths&&d.breaths.length>1){addBreaths(d.breaths);rt=d.breaths.map(function(b){return b.text}).join('\n')}else{rt=d.reply||'...';addQMessage(rt)}chatHistory.push({role:'q',text:rt,time:Date.now()});autoSaveMemory(lastUserMsg,rt);if(settings.autoTTS&&rt&&rt!=='(침묵)')speakText(rt);isWaiting=false})}).catch(function(){removeEl(rd);addQMessage("...");isWaiting=false})}

function addBreaths(b){var i=0;function n(){if(i>=b.length)return;addQMessage(b[i].text,i>0,i===b.length-1);var p=b[i].pause_ms||0;i++;if(p>0&&i<b.length)setTimeout(n,p);else n()}n()}

function addUserMessage(t){var c=document.getElementById('chatArea'),d=document.createElement('div');d.className='msg msg-user';var s=document.createElement('span');s.className='user-text';s.textContent=t;d.appendChild(s);c.appendChild(d);scrollEnd()}

function addQMessage(t,cont,acts,inst){t=t.replace(/\[silence\]/g,'').trim();if(!t)return;cont=cont||false;acts=acts===undefined?true:acts;inst=inst||false;var c=document.getElementById('chatArea'),d=document.createElement('div');d.className='msg msg-q';var h='',sp=parseInt(settings.charSpeed)||25;
if(!cont)h+='<div class="q-label"><img src="/static/icons/ic_comma_only.png" class="icon" style="width:13px;height:13px;opacity:0.25;filter:invert(1) brightness(0);drop-shadow(0 0 4px rgba(0,0,0,0.1))" alt="Q"></div>';
if(inst){h+='<div class="q-text">'+esc(t).replace(/\n/g,'<br>')+'</div>'}else{var cs='';for(var i=0;i<t.length;i++){var ch=t[i];if(ch===' ')cs+=' ';else if(ch==='\n')cs+='<br>';else cs+='<span class="qc" style="opacity:0">'+esc(ch)+'</span>'}h+='<div class="q-text">'+cs+'</div>'}
if(acts)h+='<div class="q-actions"><img src="/static/icons/quote_copy.png" class="icon" alt="copy" data-action="copy"><img src="/static/icons/voice_output.png" class="icon" alt="listen" data-action="speak"><img src="/static/icons/reply_refresh.png" class="icon" alt="retry" data-action="retry"></div>';
d.innerHTML=h;var qt=t;d.querySelectorAll('[data-action]').forEach(function(b){b.addEventListener('click',function(){var a=b.getAttribute('data-action');if(a==='copy')copyText(qt,b);else if(a==='speak')speakText(qt,b);else if(a==='retry')retryLast()})});
c.appendChild(d);scrollEnd();
if(!inst){var spans=d.querySelectorAll('.qc');for(var si=0;si<spans.length;si++){(function(el,idx){setTimeout(function(){el.style.transition='opacity 0.3s ease';el.style.opacity='1'},idx*sp)})(spans[si],si)}}}

function glowScanLastUser(){return new Promise(function(res){var a=document.querySelectorAll('.user-text'),l=a[a.length-1];if(!l){res();return}var t=l.textContent,ch=t.split(''),h='';for(var j=0;j<ch.length;j++)h+='<span>'+esc(ch[j])+'</span>';l.innerHTML=h;var sp=l.querySelectorAll('span'),i=0,s=Math.max(35,Math.min(100,1000/ch.length));function st(){if(i>=sp.length){l.classList.add('scanned');setTimeout(res,250);return}sp[i].classList.add('word-glow');var c=i;setTimeout(function(){sp[c].classList.remove('word-glow')},180);i++;setTimeout(st,s+(Math.random()*40-20))}setTimeout(st,150)})}
function showSilence(){var c=document.getElementById('chatArea'),d=document.createElement('div');d.className='msg msg-silence';d.innerHTML='<div class="silence-dot"></div>';c.appendChild(d);scrollEnd()}
function showReading(){var c=document.getElementById('chatArea'),d=document.createElement('div');d.className='reading-dots';d.innerHTML='<div class="r-dot"></div><div class="r-dot"></div><div class="r-dot"></div>';c.appendChild(d);scrollEnd();return d}
function removeEl(e){if(e&&e.parentNode)e.parentNode.removeChild(e)}
function scrollEnd(){var c=document.getElementById('chatArea');if(c)c.scrollTop=c.scrollHeight}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
window.addEventListener('beforeunload',function(){saveCurrentSession()});
</script>
</body>
</html>
