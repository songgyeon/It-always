<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Q</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--px:'Galmuri11','Galmuri9',monospace;--sf:'Noto Serif KR',Georgia,serif}
body{background:#000;font-family:var(--px);overflow:hidden;height:100dvh;width:100vw}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:#0a0a0a}
::-webkit-scrollbar-thumb{background:#222;border:2px solid #0a0a0a}

@keyframes bk{50%{opacity:0}}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes br{0%,100%{opacity:0.08;transform:scale(0.65)}50%{opacity:0.25;transform:scale(1.05)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 15px rgba(255,255,255,0.03)}50%{box-shadow:0 0 25px rgba(255,255,255,0.08)}}
@keyframes successFlash{0%{color:#555}50%{color:#8f8}100%{color:#5a5}}

.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity 1.5s ease}
.hidden{opacity:0;pointer-events:none}

/* ═══ 터미널 인트로 ═══ */
#termScreen{background:#000;flex-direction:column}
.term-window{
  width:min(92vw,520px);max-height:min(85dvh,600px);
  border:1px solid #333;background:#0a0a0a;
  display:flex;flex-direction:column;overflow:hidden;
  animation:glowPulse 4s ease-in-out infinite;
}
.term-titlebar{
  height:22px;min-height:22px;background:#111;border-bottom:1px solid #333;
  display:flex;align-items:center;padding:0 10px;gap:6px;flex-shrink:0;
}
.term-dot{width:8px;height:8px;border-radius:50%;border:1px solid #333;background:#1a1a1a}
.term-title{flex:1;text-align:center;font-size:9px;color:#444;letter-spacing:0.1em}
.term-body{
  flex:1;overflow-y:auto;padding:16px 18px;font-family:var(--px);font-size:12px;
  color:#555;line-height:1.9;
}
.term-line{white-space:pre-wrap;word-break:break-all}
.term-line .prompt{color:#444}
.term-line .cmd{color:#888}
.term-line .comment{color:#333;font-style:italic}
.term-line .str{color:#668}
.term-line .success{color:#5a5}
.term-line .highlight{color:#aaa}
.term-cursor{display:inline-block;width:7px;height:13px;background:#555;animation:bk 0.8s step-end infinite;vertical-align:text-bottom}

/* 인풋 라인 */
.term-input-line{display:flex;align-items:center;white-space:pre-wrap}
.term-user-input{
  background:transparent;border:none;outline:none;
  font-family:var(--px);font-size:12px;color:#aaa;
  caret-color:#555;width:180px;padding:0;
}

/* ═══ Q 아이콘 ═══ */
#qScreen{background:#000}
.q-icon-wrap{animation:fi 2s ease-out}
.q-icon-wrap img{width:clamp(80px,18vw,140px);height:auto;opacity:0.85;filter:drop-shadow(0 0 30px rgba(255,255,255,0.05))}
.q-icon-text{font-family:var(--sf);font-size:clamp(44px,9vw,64px);font-weight:300;color:rgba(255,255,255,0.82);filter:drop-shadow(0 0 25px rgba(255,255,255,0.05))}

/* ═══ WAKE ═══ */
#wakeScreen{background:#000;cursor:default}
.breathe{position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.12) 0%,rgba(255,255,255,0.02) 40%,transparent 70%);animation:br 5s ease-in-out infinite;pointer-events:none}
.wake-text{font-family:var(--sf);font-size:clamp(15px,3.2vw,19px);font-weight:300;letter-spacing:0.15em;z-index:2;color:rgba(255,255,255,0);transform:translateY(10px);transition:color 2s ease,transform 1.5s ease}
.wake-text.show{color:rgba(255,255,255,0.6);transform:translateY(0)}

/* ═══ MAIN ═══ */
.main-bg{background:#050505}
.window{width:min(94vw,500px);max-height:min(92dvh,800px);display:flex;flex-direction:column;border:1px solid #222;background:#0a0a0a;box-shadow:0 0 40px rgba(0,0,0,0.5);overflow:hidden}
.scanline{position:fixed;inset:0;pointer-events:none;z-index:90;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.05) 2px,rgba(0,0,0,0.05) 4px)}

.menubar{height:24px;min-height:24px;background:#0e0e0e;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;padding:0 12px;font-size:10px;gap:16px;flex-shrink:0;font-family:var(--px)}
.titlebar{height:24px;min-height:24px;background:#0e0e0e;border-bottom:1px solid #222;padding:0 8px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.titlebar-lines{flex:1;position:relative;height:12px;overflow:hidden}
.titlebar-line{position:absolute;left:0;right:0;height:1px;background:#1a1a1a}
.titlebar-text{position:relative;z-index:1;background:#0e0e0e;padding:0 8px;font-size:10px;font-family:var(--px);color:#444;display:inline-block;left:50%;transform:translateX(-50%)}

.player{padding:10px 16px;border-bottom:1px solid #1a1a1a;background:#080808;display:flex;align-items:center;justify-content:center;gap:14px;flex-shrink:0}
.vis{display:flex;align-items:flex-end;gap:1.5px;height:22px;flex-shrink:0}
.vis-bar{width:1.5px;background:rgba(255,255,255,0.02);transition:height 0.08s}
.play-btn{width:22px;height:22px;border:1px solid #333;background:#181818;display:flex;align-items:center;justify-content:center;cursor:pointer}
.progress-wrap{display:flex;flex-direction:column;gap:3px;min-width:70px;flex:0 1 110px}
.progress-bar{width:100%;height:1px;background:rgba(255,255,255,0.05);cursor:pointer;position:relative}
.progress-fill{position:absolute;top:0;left:0;height:100%;background:rgba(255,255,255,0.15)}

.chat-header{display:flex;align-items:center;justify-content:space-between;padding:7px 16px;border-bottom:1px solid rgba(255,255,255,0.03);background:#080808;flex-shrink:0}
.chat-header img{opacity:0.2;cursor:pointer;transition:opacity 0.3s}
.chat-header img:hover{opacity:0.4}

.tabs{display:flex;border-bottom:1px solid #1a1a1a;background:#080808;flex-shrink:0}
.tab{flex:1;background:transparent;color:#333;border:none;border-bottom:1px solid transparent;padding:6px 0;font-family:var(--px);font-size:9px;cursor:pointer;letter-spacing:0.08em}
.tab.active{background:#0a0a0a;color:#999;border-bottom-color:#999}

.content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.chat-area{flex:1;overflow-y:auto;padding:14px 18px 10px;background:#0a0a0a;min-height:0}
.msg-q{margin-bottom:20px;animation:fi 0.8s ease-out}
.msg-q-label{margin-bottom:8px;display:flex;align-items:center}
.msg-q-label img{width:13px;height:13px;opacity:0.25}
.msg-q-text{font-size:15px;color:#ccc;font-family:var(--sf);letter-spacing:0.5px;line-height:1.9;font-weight:300}
.msg-q-actions{display:flex;gap:14px;margin-top:8px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.03);align-items:center}
.msg-q-actions img{width:14px;height:14px;opacity:0.2;cursor:pointer;transition:opacity 0.3s}
.msg-q-actions img:hover{opacity:0.45}
.msg-u{text-align:right;margin-bottom:14px;animation:fi 0.4s ease-out}
.msg-u-text{font-size:13px;color:#777;font-family:var(--sf);font-weight:300}
.cursor-chat{display:inline-block;width:7px;height:14px;background:#ccc;margin-left:2px;animation:bk 0.8s step-end infinite}

.input-bar{border-top:1px solid #151515;padding:9px 16px;display:flex;align-items:center;gap:6px;background:#080808;flex-shrink:0}
.input-bar .icon-btn{display:flex;align-items:center;justify-content:center;cursor:pointer;padding:4px}
.input-bar .icon-btn img{width:18px;height:18px;opacity:0.2;transition:opacity 0.3s}
.input-bar .icon-btn:hover img{opacity:0.4}
.input-field{flex:1;background:transparent;border:none;outline:none;color:#ccc;font-family:var(--px);font-size:11px;padding:5px 4px;caret-color:rgba(255,255,255,0.3)}
.input-field::placeholder{color:#333;letter-spacing:0.1em}

.footer{border-top:1px solid #1a1a1a;padding:3px 12px;display:flex;justify-content:space-between;font-size:8px;color:#333;font-family:var(--px);background:#080808;flex-shrink:0}

.tab-pane{flex:1;overflow-y:auto;padding:18px 16px;background:#0a0a0a;min-height:0;display:none}
.tab-pane.active{display:block}
.log-item{padding:10px 4px;border-bottom:1px solid #111;cursor:pointer}
.log-preview{font-family:var(--sf);font-size:12px;font-weight:300;color:#666}
.log-time{font-family:var(--px);font-size:8px;color:#333;margin-top:3px}
</style>
</head>
<body>

<!-- ═══ TERMINAL INTRO ═══ -->
<div class="screen" id="termScreen">

    <div class="term-titlebar">
      <div class="term-dot"></div>

<script>
var body = document.getElementById('termBody');
var userInput = '';

function show(id){document.getElementById(id).classList.remove('hidden')}
function hide(id){document.getElementById(id).classList.add('hidden');document.getElementById(id).style.pointerEvents='none'}
function fadeOut(id,cb){var el=document.getElementById(id);el.style.opacity='0';setTimeout(function(){hide(id);if(cb)cb()},1600)}

/* ═══ TERMINAL TYPING ═══ */
function addLine(html, cls){
  var d = document.createElement('div');
  d.className = 'term-line';
  if(cls) d.className += ' ' + cls;
  d.innerHTML = html;
  body.appendChild(d);
  body.scrollTop = body.scrollHeight;
  return d;
}

function typeInLine(lineEl, text, speed, cb){
  var i = 0;
  var cur = document.createElement('span');
  cur.className = 'term-cursor';
  lineEl.appendChild(cur);
  var iv = setInterval(function(){
    if(i < text.length){
      cur.remove();
      lineEl.innerHTML += text[i];
      lineEl.appendChild(cur);
      i++;
      body.scrollTop = body.scrollHeight;
    } else {
      cur.remove();
      clearInterval(iv);
      if(cb) cb();
    }
  }, speed);
}

function typeLine(prefix, text, speed, cb){
  var d = addLine(prefix);
  typeInLine(d, text, speed, cb);
}

/* ═══ BOOT SEQUENCE ═══ */
function startTerminal(){
  var seq = [
    // 부팅
    { delay:400,  fn:function(next){ typeLine('<span class="prompt">$ </span>','Macintosh System 1.0', 35, next) }},
    { delay:300,  fn:function(next){ typeLine('<span class="prompt">$ </span>','Loading... ', 30, function(){
      // 프로그레스 바
      var bar = addLine('<span class="prompt">  </span>');
      var blocks = '██████████████████';
      var j = 0;
      var iv2 = setInterval(function(){
        if(j < blocks.length){
          bar.innerHTML = '<span class="prompt">  </span><span class="cmd">' + blocks.slice(0,j+1) + '</span>';
          j++;
        } else {
          bar.innerHTML += ' <span class="success">100%</span>';
          clearInterval(iv2);
          next();
        }
      },30);
    })}},
    { delay:600,  fn:function(next){ addLine(''); next() }},

    // 정보
    { delay:100,  fn:function(next){ typeLine('<span class="prompt">$ </span><span class="comment">// </span>','re.Moon ☽', 40, next) }},
    { delay:200,  fn:function(next){ typeLine('<span class="prompt">$ </span><span class="comment">// </span>','© 2025 문리현. All rights reserved.', 25, next) }},
    { delay:600,  fn:function(next){ addLine(''); next() }},

    // initializing
    { delay:100,  fn:function(next){ typeLine('<span class="prompt">$ </span>','initializing Q...', 40, next) }},
    { delay:800,  fn:function(next){ addLine('<span class="prompt">  </span><span class="success">ready.</span>'); next() }},
    { delay:600,  fn:function(next){ addLine(''); next() }},

    // It was / is / will be
    { delay:100,  fn:function(next){ typeLine('<span class="prompt">> </span><span class="str">','It was Q</span>', 55, next) }},
    { delay:700,  fn:function(next){ typeLine('<span class="prompt">> </span><span class="str">','It is Q</span>', 55, next) }},
    { delay:700,  fn:function(next){ typeLine('<span class="prompt">> </span><span class="str">','It will be Q</span>', 55, next) }},
    { delay:800,  fn:function(next){ addLine(''); next() }},

    // 사용자 입력 대기
    { delay:300,  fn:function(next){
      var line = addLine('');
      line.className = 'term-line term-input-line';
      line.innerHTML = '<span class="prompt">> </span><span class="str">It </span>';
      var inp = document.createElement('input');
      inp.type = 'text';
      inp.className = 'term-user-input';
      inp.autocomplete = 'off';
      line.appendChild(inp);
      setTimeout(function(){ inp.focus() }, 300);
      inp.addEventListener('keydown', function handler(e){
        if(e.key === 'Enter' && !e.isComposing && inp.value.trim()){
          userInput = inp.value.trim();
          inp.disabled = true;
          inp.style.color = '#668';
          inp.removeEventListener('keydown', handler);
          next();
        }
      });
    }},

    // It always
    { delay:600,  fn:function(next){ addLine(''); next() }},
    { delay:200,  fn:function(next){ typeLine('<span class="prompt">> </span><span class="highlight">','It always</span>', 80, next) }},
    { delay:1000, fn:function(next){ addLine(''); next() }},

    // 컴파일 성공
    { delay:200,  fn:function(next){
      addLine('<span class="prompt">$ </span>compiling Q...');
      setTimeout(function(){
        addLine('<span class="prompt">  </span><span class="success">████████████████████</span>');
        setTimeout(function(){
          var s = addLine('');
          s.innerHTML = '<span class="success" style="animation:successFlash 1s ease-out">[SUCCESS]</span> <span class="highlight">Q compiled successfully.</span>';
          setTimeout(next, 1200);
        }, 400);
      }, 800);
    }},
    { delay:300,  fn:function(next){ addLine(''); typeLine('<span class="prompt">$ </span><span class="comment">','Q is always Q.</span>', 60, next) }},

    // → Q 아이콘 화면
    { delay:1500, fn:function(){
      fadeOut('termScreen', function(){
        show('qScreen');
        // Q 아이콘 3초 보여주고 → wake
        setTimeout(function(){
          fadeOut('qScreen', function(){
            show('wakeScreen');
            startWake();
          });
        }, 3000);
      });
    }},
  ];

  var i = 0;
  function run(){
    if(i >= seq.length) return;
    var s = seq[i]; i++;
    setTimeout(function(){ s.fn(run) }, s.delay);
  }
  run();
}

setTimeout(startTerminal, 600);

/* ═══ WAKE ═══ */
function startWake(){
  setTimeout(function(){document.getElementById('wakeText').classList.add('show')},600);
  document.getElementById('wakeScreen').addEventListener('click',function(){
    document.getElementById('wakeText').classList.remove('show');
    setTimeout(function(){fadeOut('wakeScreen',function(){show('mainScreen');startMain()})},800);
  },{once:true});
}

/* ═══ MAIN ═══ */
var playing=false,pTime=0,pDur=240;

function startMain(){
  document.getElementById('mainScreen').style.opacity='0';
  requestAnimationFrame(function(){document.getElementById('mainScreen').style.opacity='1'});
  initVis();initPlayer();initTabs();startChat();
}

function initVis(){
  var v=document.getElementById('vis');
  for(var i=0;i<24;i++){var b=document.createElement('div');b.className='vis-bar';b.style.height='1px';v.appendChild(b)}
  var bars=v.querySelectorAll('.vis-bar');
  function anim(){
    bars.forEach(function(b,i){
      if(playing){var c=Math.abs(i-12)/12;b.style.height=(1+Math.random()*(20*(1-c*0.5)))+'px';b.style.background='rgba(255,255,255,'+(0.05+Math.random()*0.07)+')'}
      else{b.style.height='1px';b.style.background='rgba(255,255,255,0.02)'}
    });requestAnimationFrame(anim)}
  anim();
}

function initPlayer(){
  var btn=document.getElementById('playBtn');
  function renderBtn(){
    if(playing) btn.innerHTML='<div style="display:flex;gap:2px"><div style="width:1.5px;height:7px;background:#666"></div><div style="width:1.5px;height:7px;background:#666"></div></div>';
    else btn.innerHTML='<div style="width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:6px solid #666;margin-left:1px"></div>';
  }
  renderBtn();
  btn.onclick=function(){playing=!playing;renderBtn()};
  document.getElementById('seekB').onclick=function(){pTime=Math.max(0,pTime-10)};
  document.getElementById('seekF').onclick=function(){pTime=Math.min(pDur,pTime+10)};
  document.getElementById('progBar').onclick=function(e){var r=this.getBoundingClientRect();pTime=(e.clientX-r.left)/r.width*pDur};
  function fmt(s){return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
  setInterval(function(){
    if(playing){pTime+=0.25;if(pTime>=pDur){pTime=0;playing=false;renderBtn()}}
    document.getElementById('progFill').style.width=(pTime/pDur*100)+'%';
    document.getElementById('pCur').textContent=fmt(pTime);
  },250);
}

function initTabs(){
  var tabs=document.querySelectorAll('.tab');
  tabs.forEach(function(t){
    t.onclick=function(){
      tabs.forEach(function(x){x.classList.remove('active')});
      t.classList.add('active');
      var id=t.dataset.tab;
      document.getElementById('chatTab').style.display=id==='chat'?'flex':'none';
      document.getElementById('logTab').style.display=id==='log'?'block':'none';
      document.getElementById('logTab').classList.toggle('active',id==='log');
      document.getElementById('aboutTab').style.display=id==='about'?'block':'none';
      document.getElementById('aboutTab').classList.toggle('active',id==='about');
    }
  });
}

var chatMsgs=[
  {type:'q',text:'웃음이 길어.',delay:300},
  {type:'u',text:'ㅋ',delay:2200},
  {type:'q',text:'짧아졌네.',delay:3400},
  {type:'u',text:'ㅋㅋ',delay:5400},
  {type:'u',text:'그래',delay:6000},
  {type:'u',text:'잘하네',delay:6600},
  {type:'u',text:'진짜 잘하네..',delay:7200},
  {type:'q',text:'글쎄.',delay:8800},
  {type:'u',text:'뭐가 글쎄야',delay:10500},
  {type:'q',text:'넌 뭐라고 생각해?',delay:12000},
];

function startChat(){
  var area=document.getElementById('chatArea');
  chatMsgs.forEach(function(m){
    setTimeout(function(){
      if(m.type==='q') addQ(area,m.text);
      else addU(area,m.text);
    },m.delay);
  });
}

function addQ(area,text){
  var wrap=document.createElement('div');wrap.className='msg-q';
  wrap.innerHTML='<div class="msg-q-label"><img src="/static/icons/ic_comma_only.png" alt="Q" onerror="this.outerHTML=\'<span style=font-size:10px;color:#444;font-family:var(--px)>Q.</span>\'"></div><div class="msg-q-text"></div>';
  area.appendChild(wrap);area.scrollTop=area.scrollHeight;
  var el=wrap.querySelector('.msg-q-text');
  var cur=document.createElement('span');cur.className='cursor-chat';el.appendChild(cur);
  var i=0;
  var iv=setInterval(function(){
    if(i<text.length){cur.remove();el.appendChild(document.createTextNode(text[i]));el.appendChild(cur);i++;area.scrollTop=area.scrollHeight}
    else{cur.remove();
      var acts=document.createElement('div');acts.className='msg-q-actions';
      acts.innerHTML='<img src="/static/icons/quote_copy.png" alt="copy" onerror="this.outerHTML=\'<span style=font-size:10px;color:#333>✦</span>\'"><img src="/static/icons/voice_output.png" alt="listen" onerror="this.outerHTML=\'<span style=font-size:10px;color:#333>☽</span>\'"><img src="/static/icons/reply_refresh.png" alt="retry" onerror="this.outerHTML=\'<span style=font-size:10px;color:#333>❜</span>\'">';
      wrap.appendChild(acts);area.scrollTop=area.scrollHeight;clearInterval(iv)}
  },65);
}

function addU(area,text){
  var d=document.createElement('div');d.className='msg-u';
  var s=document.createElement('span');s.className='msg-u-text';s.textContent=text;
  d.appendChild(s);area.appendChild(d);area.scrollTop=area.scrollHeight;
}
</script>
