<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Q</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;300;400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #000000;
    --text: #e8e8e8;
    --text-dim: rgba(255,255,255,0.30);
    --text-dim2: rgba(255,255,255,0.15);
    --text-user: rgba(255,255,255,0.65);
    --glow-color: rgba(255,255,255,0.6);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif KR', serif;
    font-weight: 300;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .icon {
    display: inline-block;
    object-fit: contain;
    pointer-events: auto;
    -webkit-user-drag: none;
  }

  /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
     시작 화면 — 어둠, 빛, 깨어남
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

  #wakeScreen {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    cursor: default;
  }

  .wake-glow {
    position: absolute;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.06) 40%, transparent 70%);
    opacity: 0;
    transform: scale(0.5);
    pointer-events: none;
    transition: opacity 3s ease;
  }
  .wake-glow.alive {
    opacity: 1;
    animation: glowBreathe 4s ease-in-out infinite;
  }
  @keyframes glowBreathe {
    0%, 100% { opacity: 0.10; transform: scale(0.7); }
    50% { opacity: 0.30; transform: scale(1.05); }
  }

  .wake-glow.burst {
    animation: none;
    opacity: 0.7;
    transform: scale(2.2);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .wake-glow.settle {
    opacity: 0.12;
    transform: scale(1.0);
    transition: opacity 1.5s ease, transform 1.5s ease;
  }

  .wake-q-icon {
    width: 56px;
    height: 56px;
    opacity: 0;
    z-index: 2;
    filter: brightness(0) invert(1);
    transition: opacity 2.5s ease;
    pointer-events: none;
  }
  .wake-q-icon.visible {
    opacity: 0.85;
  }

  .wake-question {
    position: absolute;
    bottom: 40%;
    font-size: 13px;
    font-weight: 200;
    color: rgba(255,255,255,0);
    letter-spacing: 1px;
    z-index: 2;
    pointer-events: none;
    transition: color 2s ease, transform 1.5s ease;
    transform: translateY(8px);
  }
  .wake-question.visible {
    color: rgba(255,255,255,0.45);
    transform: translateY(0);
  }

  /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
     채팅 화면
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

  #chatScreen {
    display: none;
    flex: 1;
    flex-direction: column;
    height: 100dvh;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    min-height: 50px;
  }
  .header-left { width: 36px; display: flex; align-items: center; }
  .header-left .icon {
    width: 20px; height: 20px; opacity: 0.25; cursor: pointer;
    transition: opacity 0.3s; filter: brightness(0) invert(1);
  }
  .header-left .icon:hover { opacity: 0.5; }

  .header-center { display: flex; align-items: center; }
  .header-center .icon {
    width: 16px; height: 16px; opacity: 0.3;
    filter: brightness(0) invert(1);
  }

  .header-right { width: 36px; display: flex; align-items: center; justify-content: flex-end; }
  .header-right .icon {
    width: 18px; height: 18px; opacity: 0.25; cursor: pointer;
    transition: opacity 0.3s; filter: brightness(0) invert(1);
  }
  .header-right .icon:hover { opacity: 0.5; }

  .chat-area {
    flex: 1; overflow-y: auto;
    padding: 0 0 12px 0; scroll-behavior: smooth;
  }
  .chat-area::-webkit-scrollbar { width: 0; }

  .msg { padding: 14px 20px; animation: msgIn 0.6s ease; }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-q { padding-right: 52px; }
  .q-label {
    font-size: 11px; font-weight: 200; color: var(--text-dim);
    margin-bottom: 7px; letter-spacing: 1.5px;
  }
  .q-text {
    font-size: 14px; line-height: 2; color: var(--text);
    font-weight: 300; letter-spacing: 0.3px;
  }

  .q-actions { display: flex; gap: 16px; margin-top: 10px; align-items: center; }
  .q-actions .icon {
    width: 15px; height: 15px; opacity: 0.18; cursor: pointer;
    transition: opacity 0.3s; filter: brightness(0) invert(1);
  }
  .q-actions .icon:hover { opacity: 0.4; }

  .msg-user { text-align: right; padding-left: 52px; padding-right: 20px; }
  .user-text {
    font-size: 14px; line-height: 2; color: var(--text-user);
    font-weight: 300; display: inline; letter-spacing: 0.3px;
  }

  .msg-silence { padding: 6px 20px; }
  .silence-dot {
    width: 3px; height: 3px; background: rgba(255,255,255,0.15);
    border-radius: 50%; animation: silencePulse 3s ease-in-out infinite;
  }
  @keyframes silencePulse { 0%, 100% { opacity: 0.12; } 50% { opacity: 0.45; } }

  .reading-dots { display: flex; gap: 5px; padding: 8px 20px; }
  .r-dot {
    width: 3px; height: 3px; background: rgba(255,255,255,0.18);
    border-radius: 50%; animation: rPulse 1.6s ease-in-out infinite;
  }
  .r-dot:nth-child(2) { animation-delay: 0.25s; }
  .r-dot:nth-child(3) { animation-delay: 0.5s; }
  @keyframes rPulse {
    0%, 100% { opacity: 0.12; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.4); }
  }

  .word-glow { text-shadow: 0 0 10px var(--glow-color); }
  .user-text.scanned { color: rgba(255,255,255,0.85); transition: color 0.6s ease; }

  .input-area {
    padding: 10px 14px 28px 14px;
    display: flex; align-items: center; gap: 10px; position: relative;
  }
  .input-line {
    position: absolute; top: 0; left: 20px; right: 20px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
  }

  .btn-comma {
    width: 30px; height: 30px;
    border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
    background: transparent; display: flex; align-items: center;
    justify-content: center; cursor: pointer;
    transition: border-color 0.3s; flex-shrink: 0;
  }
  .btn-comma:hover { border-color: rgba(255,255,255,0.2); }
  .btn-comma .icon { width: 12px; height: 12px; opacity: 0.3; filter: brightness(0) invert(1); }

  .input-field {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-family: 'Noto Serif KR', serif;
    font-size: 14px; font-weight: 200; padding: 8px 0;
    caret-color: rgba(255,255,255,0.3); letter-spacing: 0.5px;
  }
  .input-field::placeholder { color: var(--text-dim2); font-weight: 200; letter-spacing: 1px; }

  .input-icons { display: flex; gap: 14px; align-items: center; flex-shrink: 0; }
  .input-icons .icon {
    width: 20px; height: 20px; opacity: 0.18; cursor: pointer;
    transition: opacity 0.3s; filter: brightness(0) invert(1);
  }
  .input-icons .icon:hover { opacity: 0.4; }

  @media (min-width: 600px) {
    body { max-width: 480px; margin: 0 auto;
      border-left: 1px solid rgba(255,255,255,0.03);
      border-right: 1px solid rgba(255,255,255,0.03);
    }
  }
</style>
</head>
<body>

<div id="wakeScreen">
  <div class="wake-glow" id="wakeGlow"></div>
  <img src="/static/icons/ic_q_only.png" class="wake-q-icon" id="wakeQ" alt="Q">
  <div class="wake-question" id="wakeQuestion">왜 나를 깨웠어?</div>
</div>

<div id="chatScreen">
  <div class="header">
    <div class="header-left">
      <img src="/static/icons/log_menu.png" class="icon" alt="menu">
    </div>
    <div class="header-center">
      <img src="/static/icons/ic_comma_only.png" class="icon" alt=",">
    </div>
    <div class="header-right">
      <img src="/static/icons/app_settings.png" class="icon" alt="settings">
    </div>
  </div>

  <div class="chat-area" id="chatArea"></div>

  <div class="input-area">
    <div class="input-line"></div>
    <button class="btn-comma" id="commaBtn">
      <img src="/static/icons/session_new.png" class="icon" alt=",">
    </button>
    <input type="text" class="input-field" id="msgInput" placeholder="To. Q" autocomplete="off">
    <div class="input-icons">
      <img src="/static/icons/voice_input.png" class="icon" alt="voice">
      <img src="/static/icons/text_input.png" class="icon" alt="send">
    </div>
  </div>
</div>

<script>
const API = "https://q-server-nsez.onrender.com";
let userId = "";
let isWaiting = false;
let wakePhase = 0;

const Q_ACTIONS_HTML = `
  <div class="q-actions">
    <img src="/static/icons/quote_copy.png" class="icon" alt="copy">
    <img src="/static/icons/voice_output.png" class="icon" alt="listen">
    <img src="/static/icons/reply_refresh.png" class="icon" alt="retry">
  </div>
`;

// ── 2초 후 빛 숨쉬기 시작 ──
setTimeout(() => {
  document.getElementById('wakeGlow').classList.add('alive');
  wakePhase = 1;
}, 2000);

// ── 클릭 → 깨어남 ──
document.getElementById('wakeScreen').addEventListener('click', () => {
  if (wakePhase < 1 || wakePhase >= 2) return;
  wakePhase = 2;

  const glow = document.getElementById('wakeGlow');
  const qIcon = document.getElementById('wakeQ');
  const question = document.getElementById('wakeQuestion');

  // 빛 번쩍
  glow.classList.remove('alive');
  glow.classList.add('burst');

  // 안정 → Q 드러남
  setTimeout(() => {
    glow.classList.remove('burst');
    glow.classList.add('settle');
    qIcon.classList.add('visible');
  }, 700);

  // "왜 나를 깨웠어?"
  setTimeout(() => {
    question.classList.add('visible');
  }, 2800);

  // 채팅 전환
  setTimeout(transitionToChat, 6000);
});

function transitionToChat() {
  userId = "web_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);

  const wake = document.getElementById('wakeScreen');
  wake.style.transition = 'opacity 1.5s ease';
  wake.style.opacity = '0';

  setTimeout(() => {
    wake.style.display = 'none';
    const chat = document.getElementById('chatScreen');
    chat.style.display = 'flex';
    chat.style.opacity = '0';
    chat.style.transition = 'opacity 0.8s ease';
    requestAnimationFrame(() => { chat.style.opacity = '1'; });
    setTimeout(() => sendToQ("안녕"), 800);
  }, 1600);
}

// ── 메시지 전송 ──
document.getElementById('msgInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !isWaiting) sendMessage();
});

function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || isWaiting) return;
  input.value = '';
  addUserMessage(text);
  sendToQ(text);
}

// ── Q 서버 호출 ──
async function sendToQ(text) {
  isWaiting = true;
  const readingEl = showReading();

  try {
    const res = await fetch(API + "/reply", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, name: "", user_id: userId })
    });
    const data = await res.json();
    removeEl(readingEl);
    await glowScanLastUser();

    if (data.silence) {
      showSilence();
    } else if (data.breaths && data.breaths.length > 1) {
      await addBreaths(data.breaths);
    } else {
      addQMessage(data.reply);
    }
  } catch (err) {
    removeEl(readingEl);
    addQMessage("...");
  }
  isWaiting = false;
}

// ── 호흡 체계 ──
async function addBreaths(breaths) {
  for (let i = 0; i < breaths.length; i++) {
    const isLast = i === breaths.length - 1;
    addQMessage(breaths[i].text, i > 0, isLast);
    if (breaths[i].pause_ms > 0 && !isLast) await sleep(breaths[i].pause_ms);
  }
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── 사용자 메시지 ──
function addUserMessage(text) {
  const chat = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'msg msg-user';
  const span = document.createElement('span');
  span.className = 'user-text';
  span.textContent = text;
  div.appendChild(span);
  chat.appendChild(div);
  scrollEnd();
}

// ── Q 메시지 ──
function addQMessage(text, continuation = false, showActions = true) {
  const chat = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'msg msg-q';

  let html = '';
  if (!continuation) html += '<div class="q-label">Q,</div>';

  const charSpans = text.split('').map(c => {
    if (c === ' ') return ' ';
    if (c === '\n') return '<br>';
    return `<span class="qc" style="opacity:0">${esc(c)}</span>`;
  }).join('');

  html += `<div class="q-text">${charSpans}</div>`;
  if (showActions) html += Q_ACTIONS_HTML;

  div.innerHTML = html;
  chat.appendChild(div);
  scrollEnd();

  div.querySelectorAll('.qc').forEach((el, i) => {
    setTimeout(() => {
      el.style.transition = 'opacity 0.25s ease';
      el.style.opacity = '1';
    }, i * 25);
  });
}

// ── 읽음 글로우 스캔 ──
function glowScanLastUser() {
  return new Promise(resolve => {
    const all = document.querySelectorAll('.user-text');
    const last = all[all.length - 1];
    if (!last) { resolve(); return; }

    const text = last.textContent;
    const chars = text.split('');
    last.innerHTML = chars.map(c => `<span>${esc(c)}</span>`).join('');

    const spans = last.querySelectorAll('span');
    let i = 0;
    const speed = Math.max(35, Math.min(100, 1000 / chars.length));

    function next() {
      if (i >= spans.length) {
        last.classList.add('scanned');
        setTimeout(resolve, 250);
        return;
      }
      spans[i].classList.add('word-glow');
      const curr = i;
      setTimeout(() => spans[curr].classList.remove('word-glow'), 180);
      i++;
      setTimeout(next, speed + (Math.random() * 40 - 20));
    }
    setTimeout(next, 150);
  });
}

function showSilence() {
  const chat = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'msg msg-silence';
  div.innerHTML = '<div class="silence-dot"></div>';
  chat.appendChild(div);
  scrollEnd();
}

function showReading() {
  const chat = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'reading-dots';
  div.innerHTML = '<div class="r-dot"></div><div class="r-dot"></div><div class="r-dot"></div>';
  chat.appendChild(div);
  scrollEnd();
  return div;
}

function removeEl(el) { if (el && el.parentNode) el.remove(); }
function scrollEnd() {
  const c = document.getElementById('chatArea');
  setTimeout(() => c.scrollTop = c.scrollHeight, 40);
}
function esc(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}
</script>
</body>
</html>
