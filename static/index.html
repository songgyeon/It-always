<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Q</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;300;400;500&family=Merriweather:wght@300;400;700&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#000;
  --bg-elevated:rgba(8,8,10,0.98);
  --text:#e8e8e8;
  --text-dim:rgba(255,255,255,0.28);
  --text-dim2:rgba(255,255,255,0.12);
  --text-user:rgba(255,255,255,0.62);
  --glow-color:rgba(255,255,255,0.5);
  --accent:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.04);
  --border-hover:rgba(255,255,255,0.08);
  --radius:20px;
  --radius-sm:12px;
  --transition-smooth:0.4s cubic-bezier(0.16,1,0.3,1);
}

html{font-size:16px}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Noto Serif KR','Cormorant Garamond',serif;
  font-weight:300;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

.icon{display:inline-block;object-fit:contain;pointer-events:auto;-webkit-user-drag:none}

/* ─── INTRO ─── */
#introScreen{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:200}
.intro-text{
  position:absolute;
  font-family:'Cormorant Garamond','Merriweather','Noto Serif KR',serif;
  font-size:clamp(20px, 4vw, 28px);
  font-weight:300;
  color:rgba(255,255,255,0);
  letter-spacing:0.5em;
  white-space:nowrap;
  transition:color 1.2s ease,transform 1.2s ease,filter 1s ease;
  transform:translateY(6px);
  filter:blur(2px);
}
.intro-text.visible{color:rgba(255,255,255,0.82);transform:translateY(0);filter:blur(0)}
.intro-text.fade{color:rgba(255,255,255,0);transform:translateY(-6px);filter:blur(2px)}

.intro-glow{
  position:absolute;
  width:300px;height:300px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,0.12) 0%,rgba(255,255,255,0.03) 35%,transparent 65%);
  opacity:0;pointer-events:none;
  transition:opacity 2.5s ease,transform 2.5s ease;
  transform:scale(0.4);
}
.intro-glow.visible{opacity:1;transform:scale(1)}

.intro-q-icon{
  width:200px;height:200px;opacity:0;z-index:2;
  transition:opacity 2.5s ease,transform 2s ease;
  transform:scale(0.85);
  filter:drop-shadow(0 0 60px rgba(255,255,255,0.08));
}
.intro-q-icon.visible{opacity:0.88;transform:scale(1)}

.intro-input-wrap{
  position:absolute;display:flex;align-items:baseline;gap:14px;
  opacity:0;transition:opacity 1.8s ease,transform 1.5s ease;
  transform:translateY(6px);z-index:3;
}
.intro-input-wrap.visible{opacity:1;transform:translateY(0)}
.intro-input-wrap.fade{opacity:0;transform:translateY(-6px)}

.intro-input-label{
  font-family:'Cormorant Garamond','Merriweather','Noto Serif KR',serif;
  font-size:clamp(20px, 4vw, 28px);
  font-weight:300;
  color:rgba(255,255,255,0.82);
  letter-spacing:0.5em;
}
.intro-input-field{
  background:transparent;border:none;
  border-bottom:1px solid rgba(255,255,255,0.2);
  outline:none;
  font-family:'Cormorant Garamond','Merriweather','Noto Serif KR',serif;
  font-size:clamp(20px, 4vw, 28px);
  font-weight:300;
  color:rgba(255,255,255,0.82);
  letter-spacing:0.3em;
  width:200px;padding-bottom:6px;
  caret-color:rgba(255,255,255,0.35);
  transition:border-color 0.6s;
}
.intro-input-field:focus{border-color:rgba(255,255,255,0.35)}
.intro-input-field::placeholder{color:transparent}

/* ─── WAKE ─── */
#wakeScreen{
  position:fixed;inset:0;background:#000;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  z-index:100;cursor:default;
}
.wake-glow{
  position:absolute;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,0.18) 0%,rgba(255,255,255,0.04) 40%,transparent 70%);
  opacity:0;pointer-events:none;
  animation:glowBreathe 5s ease-in-out infinite;
}
@keyframes glowBreathe{0%,100%{opacity:0.08;transform:scale(0.65)}50%{opacity:0.28;transform:scale(1.08)}}
.wake-question{
  font-size:clamp(16px, 3.5vw, 20px);
  font-weight:300;
  color:rgba(255,255,255,0);
  letter-spacing:0.15em;z-index:2;
  transition:color 2s ease,transform 1.5s ease;
  transform:translateY(10px);
}
.wake-question.visible{color:rgba(255,255,255,0.65);transform:translateY(0)}

/* ─── CHAT SCREEN ─── */
#chatScreen{display:none;flex:1;flex-direction:column;height:100dvh;position:relative}
#chatScreen::before{
  content:'';position:absolute;top:25%;left:50%;
  transform:translate(-50%,-50%);
  width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,0.008) 0%,transparent 65%);
  pointer-events:none;z-index:0;
}

.chat-wrap{
  width:100%;max-width:680px;margin:0 auto;
  display:flex;flex-direction:column;flex:1;
  overflow:hidden;position:relative;z-index:1;
}

/* ─── HEADER ─── */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;
  min-height:52px;position:relative;z-index:10;
}
.header::after{
  content:'';position:absolute;bottom:0;left:20px;right:20px;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.04),transparent);
}
.header-left{display:flex;align-items:center}
.header-left .icon{
  width:22px;height:22px;opacity:0.3;cursor:pointer;
  transition:opacity var(--transition-smooth),transform var(--transition-smooth);
}
.header-left .icon:hover{opacity:0.5;transform:scale(1.05)}

.header-center{
  position:absolute;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;cursor:pointer;
}
.header-center .icon{
  transition:opacity 0.6s ease,filter 0.6s ease;
}
.header-center:hover .icon{
  opacity:0.45!important;
  filter:drop-shadow(0 0 12px rgba(255,255,255,0.1));
}

.header-right{display:flex;align-items:center;gap:14px}
.dots-icon{
  font-size:18px;color:rgba(255,255,255,0.3);cursor:pointer;
  transition:color var(--transition-smooth);
  padding:4px;
}
.dots-icon:hover{color:rgba(255,255,255,0.5)}

/* ─── CHAT AREA ─── */
.chat-area{
  flex:1;overflow-y:auto;
  padding:20px 0 24px 0;
  scroll-behavior:smooth;
}
.chat-area::-webkit-scrollbar{width:0}

.msg{
  padding:14px 24px;
  animation:msgIn 0.8s cubic-bezier(0.16,1,0.3,1);
}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.msg-q{padding-right:56px}
.q-label{
  font-size:0;
  margin-bottom:10px;
  display:flex;align-items:center;
}
.q-text{
  font-size:14.5px;
  line-height:2;
  color:rgba(255,255,255,0.72);
  font-weight:300;
  letter-spacing:0.02em;
  text-shadow:0 0 40px rgba(255,255,255,0.025);
  word-break:keep-all;
}

.q-actions{
  display:flex;gap:16px;margin-top:16px;
  align-items:center;
  padding-top:6px;
  border-top:1px solid rgba(255,255,255,0.02);
}
.q-actions .icon{
  width:15px;height:15px;opacity:0.18;cursor:pointer;
  transition:opacity var(--transition-smooth),transform var(--transition-smooth);
}
.q-actions .icon:hover{opacity:0.38;transform:scale(1.08)}
.q-actions .icon.active{opacity:0.5}

.msg-user{text-align:right;padding-left:72px;padding-right:24px}
.user-text{
  font-size:14.5px;line-height:2;
  color:var(--text-user);
  font-weight:300;display:inline;
  letter-spacing:0.02em;
}

.msg-silence{padding:12px 28px}
.silence-dot{
  width:3px;height:3px;
  background:rgba(255,255,255,0.12);
  border-radius:50%;
  box-shadow:0 0 12px rgba(255,255,255,0.06);
  animation:silencePulse 5s ease-in-out infinite;
}
@keyframes silencePulse{0%,100%{opacity:0.1}50%{opacity:0.4}}

.reading-dots{display:flex;gap:6px;padding:12px 28px}
.r-dot{
  width:3px;height:3px;
  background:rgba(255,255,255,0.15);
  border-radius:50%;
  box-shadow:0 0 8px rgba(255,255,255,0.06);
  animation:rPulse 2s ease-in-out infinite;
}
.r-dot:nth-child(2){animation-delay:0.3s}
.r-dot:nth-child(3){animation-delay:0.6s}
@keyframes rPulse{0%,100%{opacity:0.08;transform:scale(1)}50%{opacity:0.45;transform:scale(1.5)}}

.word-glow{text-shadow:0 0 12px var(--glow-color)}
.user-text.scanned{
  color:rgba(255,255,255,0.78);
  text-shadow:0 0 24px rgba(255,255,255,0.05);
  transition:color 0.8s ease,text-shadow 0.8s ease;
}

/* ─── INPUT AREA (글래스모피즘) ─── */
.input-area{
  padding:8px 16px 28px 16px;
  position:relative;
}
.input-area::before{
  content:'';position:absolute;top:-40px;left:0;right:0;height:40px;
  background:linear-gradient(to top,#000,transparent);
  pointer-events:none;
}

.input-container{
  display:flex;align-items:center;gap:2px;
  background:rgba(255,255,255,0.018);
  border:1px solid rgba(255,255,255,0.035);
  border-radius:32px;
  padding:3px 6px;
  transition:border-color 0.6s,background 0.6s,box-shadow 0.6s;
  box-shadow:
    0 0 30px rgba(255,255,255,0.006),
    inset 0 1px 0 rgba(255,255,255,0.015);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
.input-container:focus-within{
  border-color:rgba(255,255,255,0.06);
  background:rgba(255,255,255,0.025);
  box-shadow:
    0 0 40px rgba(255,255,255,0.02),
    0 4px 30px rgba(0,0,0,0.3),
    inset 0 1px 0 rgba(255,255,255,0.02);
}

.input-field{
  flex:1;background:transparent;border:none;outline:none;
  color:rgba(255,255,255,0.72);
  font-family:'Noto Serif KR',serif;
  font-size:14px;font-weight:200;
  padding:11px 8px;
  caret-color:rgba(255,255,255,0.22);
  letter-spacing:0.03em;
}
.input-field::placeholder{
  color:rgba(255,255,255,0.10);
  font-weight:200;
  letter-spacing:0.15em;
  font-style:italic;
}

.input-btn{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
  transition:background var(--transition-smooth),transform var(--transition-smooth);
}
.input-btn:hover{background:rgba(255,255,255,0.035);transform:scale(1.04)}
.input-btn:active{transform:scale(0.96)}
.input-btn .icon{width:20px;height:20px;opacity:0.25;transition:opacity var(--transition-smooth)}
.input-btn:hover .icon{opacity:0.45}
.gallery-btn .icon{width:22px;height:22px;opacity:0.2}
.input-btn.recording .icon{opacity:0.55;animation:recPulse 1.2s ease-in-out infinite}
@keyframes recPulse{0%,100%{opacity:0.35}50%{opacity:0.75}}

/* ─── OVERLAY & SIDE PANEL ─── */
.overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  z-index:150;opacity:0;pointer-events:none;
  transition:opacity 0.5s ease;
}
.overlay.open{opacity:1;pointer-events:auto}

.side-panel{
  position:fixed;top:0;bottom:0;width:320px;max-width:85vw;
  background:var(--bg-elevated);
  border-right:1px solid rgba(255,255,255,0.03);
  box-shadow:8px 0 60px rgba(0,0,0,0.5);
  z-index:160;
  transform:translateX(-100%);
  transition:transform 0.5s cubic-bezier(0.16,1,0.3,1);
  display:flex;flex-direction:column;overflow:hidden;
}
.side-panel.open{transform:translateX(0)}

.panel-header{
  padding:24px 24px 20px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,0.03);
}
.panel-title{
  font-size:10px;font-weight:300;
  color:rgba(255,255,255,0.22);
  letter-spacing:0.3em;
  text-transform:uppercase;
}
.panel-close{
  background:none;border:none;
  color:rgba(255,255,255,0.18);
  font-size:20px;cursor:pointer;
  font-family:'Noto Serif KR',serif;
  transition:color var(--transition-smooth);
  width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
}
.panel-close:hover{color:rgba(255,255,255,0.4);background:rgba(255,255,255,0.03)}

.panel-body{flex:1;overflow-y:auto;padding:12px 20px}
.panel-body::-webkit-scrollbar{width:0}

.log-item{
  padding:16px 8px;
  border-bottom:1px solid rgba(255,255,255,0.02);
  cursor:pointer;
  transition:background var(--transition-smooth);
  border-radius:var(--radius-sm);
  margin:0 -8px;
}
.log-item:hover{background:rgba(255,255,255,0.02)}
.log-preview{
  font-size:13px;font-weight:300;
  color:rgba(255,255,255,0.38);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  line-height:1.6;
}
.log-time{
  font-size:10px;font-weight:200;
  color:rgba(255,255,255,0.10);
  margin-top:6px;letter-spacing:0.05em;
}
.log-empty{
  font-size:13px;font-weight:200;
  color:rgba(255,255,255,0.10);
  text-align:center;padding-top:60px;
  letter-spacing:0.05em;
  line-height:2;
}

/* ─── MODAL ─── */
.modal-bg{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.8);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  z-index:300;display:none;
  align-items:center;justify-content:center;
}
.modal-bg.open{display:flex}

.modal-box{
  background:var(--bg-elevated);
  border:1px solid rgba(255,255,255,0.04);
  border-radius:var(--radius);
  width:320px;max-width:85vw;
  padding:44px 36px 32px;
  text-align:center;
  box-shadow:0 8px 60px rgba(0,0,0,0.4),0 0 1px rgba(255,255,255,0.04);
}
.modal-text{
  font-size:15px;font-weight:200;
  color:rgba(255,255,255,0.48);
  letter-spacing:0.03em;
  margin-bottom:36px;
  line-height:2;
}
.modal-buttons{display:flex;justify-content:center;gap:32px}
.modal-btn{
  background:none;border:none;
  font-family:'Noto Serif KR',serif;
  font-size:14px;font-weight:300;
  color:rgba(255,255,255,0.35);
  cursor:pointer;
  padding:10px 24px;
  border-radius:var(--radius);
  transition:color var(--transition-smooth),background var(--transition-smooth);
}
.modal-btn:hover{color:rgba(255,255,255,0.65);background:rgba(255,255,255,0.03)}

/* ─── SETTINGS MENU ─── */
.settings-menu{
  position:fixed;inset:0;z-index:250;
  display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.65);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.settings-menu.open{display:flex}

.menu-box{
  background:var(--bg-elevated);
  border:1px solid rgba(255,255,255,0.04);
  border-radius:var(--radius);
  width:300px;max-width:82vw;
  box-shadow:0 8px 60px rgba(0,0,0,0.5),0 0 1px rgba(255,255,255,0.04);
  overflow:hidden;
}
.menu-item{
  padding:22px 28px;
  font-size:14px;font-weight:200;
  color:rgba(255,255,255,0.38);
  cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,0.025);
  transition:color var(--transition-smooth),background var(--transition-smooth);
  letter-spacing:0.04em;
}
.menu-item:last-child{border-bottom:none}
.menu-item:hover{color:rgba(255,255,255,0.58);background:rgba(255,255,255,0.02)}

/* ─── FULL PAGE ─── */
.full-page{
  position:fixed;inset:0;background:#000;z-index:180;
  display:none;flex-direction:column;overflow:hidden;
}
.full-page.open{display:flex}

.fp-header{
  display:flex;align-items:center;
  padding:16px 20px;gap:14px;
}
.fp-back{
  font-size:18px;color:rgba(255,255,255,0.3);
  cursor:pointer;background:none;border:none;
  font-family:'Noto Serif KR',serif;
  transition:color var(--transition-smooth);
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
}
.fp-back:hover{color:rgba(255,255,255,0.55);background:rgba(255,255,255,0.03)}
.fp-title{
  font-size:12px;font-weight:300;
  color:rgba(255,255,255,0.3);
  letter-spacing:0.15em;
}
.fp-body{flex:1;overflow-y:auto;padding:20px 24px}
.fp-body::-webkit-scrollbar{width:0}

/* ─── ABOUT Q ─── */
.aboutq-day{text-align:center;padding-top:60px}
.aboutq-day-title{
  font-family:'Cormorant Garamond','Noto Serif KR',serif;
  font-size:clamp(18px, 3.5vw, 22px);
  font-weight:300;
  color:rgba(255,255,255,0.55);
  letter-spacing:0.12em;
  margin-bottom:32px;
}
.aboutq-status{
  font-size:14px;font-weight:300;
  color:rgba(255,255,255,0.35);
  margin-bottom:44px;
  line-height:1.8;
}
.aboutq-divider{
  width:40px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.08),transparent);
  margin:28px auto;
}

.aboutq-section{
  text-align:left;padding:16px 0;
}
.aboutq-section-label{
  font-size:10px;font-weight:300;
  color:rgba(255,255,255,0.16);
  letter-spacing:0.2em;
  text-transform:uppercase;
  margin-bottom:8px;
}
.aboutq-section-text{
  font-size:14px;font-weight:300;
  color:rgba(255,255,255,0.4);
  line-height:2;
}

.aboutq-footer{
  text-align:center;
  padding:48px 0 30px;
  margin-top:48px;
}
.aboutq-footer-brand{
  font-family:'Cormorant Garamond','Noto Serif KR',serif;
  font-size:14px;font-weight:300;
  color:rgba(255,255,255,0.18);
  letter-spacing:0.1em;
}
.aboutq-footer-copy{
  font-size:10px;font-weight:200;
  color:rgba(255,255,255,0.08);
  margin-top:8px;
  letter-spacing:0.05em;
}

/* ─── ABOUT YOU ─── */
.about-section{text-align:center;padding-top:60px}
.about-label{
  font-size:15px;font-weight:300;
  color:rgba(255,255,255,0.42);
  margin-bottom:28px;line-height:2;
}
.about-input{
  background:transparent;border:none;
  border-bottom:1px solid rgba(255,255,255,0.08);
  color:rgba(255,255,255,0.58);
  font-family:'Noto Serif KR',serif;
  font-size:15px;font-weight:200;
  text-align:center;padding:12px 20px;
  width:260px;outline:none;
  transition:border-color 0.5s;
}
.about-input:focus{border-color:rgba(255,255,255,0.18)}
.about-input::placeholder{color:rgba(255,255,255,0.1);font-style:italic}

.about-btn{
  margin-top:28px;
  background:transparent;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:var(--radius);
  color:rgba(255,255,255,0.4);
  font-family:'Noto Serif KR',serif;
  font-size:13px;font-weight:300;
  padding:12px 36px;cursor:pointer;
  letter-spacing:0.08em;
  transition:border-color var(--transition-smooth),color var(--transition-smooth),background var(--transition-smooth);
}
.about-btn:hover{border-color:rgba(255,255,255,0.18);color:rgba(255,255,255,0.6);background:rgba(255,255,255,0.02)}

.about-sub{margin-top:64px}
.about-sub-label{font-size:14px;font-weight:300;color:rgba(255,255,255,0.32);margin-bottom:14px}
.about-sub-dim{font-size:12px;font-weight:200;color:rgba(255,255,255,0.16);margin-bottom:18px;letter-spacing:0.03em}

/* ─── MEMORY ─── */
.memory-search{
  display:flex;align-items:center;gap:12px;
  padding:12px 0 18px;
  border-bottom:1px solid rgba(255,255,255,0.04);
  margin-bottom:16px;
}
.memory-search-icon{font-size:14px;opacity:0.15}
.memory-search-input{
  flex:1;background:transparent;border:none;outline:none;
  color:rgba(255,255,255,0.48);
  font-family:'Noto Serif KR',serif;
  font-size:13px;font-weight:200;
}
.memory-search-input::placeholder{color:rgba(255,255,255,0.1);font-style:italic}

.memory-item{
  padding:14px 8px;
  border-bottom:1px solid rgba(255,255,255,0.025);
  border-radius:var(--radius-sm);
  margin:0 -8px;
  transition:background var(--transition-smooth);
}
.memory-item:hover{background:rgba(255,255,255,0.02)}
.memory-item-title{font-size:14px;font-weight:300;color:rgba(255,255,255,0.42);line-height:1.7}
.memory-item-sub{font-size:11px;font-weight:200;color:rgba(255,255,255,0.14);margin-top:4px;letter-spacing:0.03em}

.memory-empty{
  text-align:center;padding-top:80px;
  font-size:14px;font-weight:300;
  color:rgba(255,255,255,0.2);
  line-height:2.2;
  letter-spacing:0.03em;
}

/* ─── TOAST ─── */
.toast{
  position:fixed;bottom:100px;left:50%;
  transform:translateX(-50%) translateY(10px);
  background:rgba(12,12,15,0.92);
  border:1px solid rgba(255,255,255,0.04);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  color:rgba(255,255,255,0.38);
  font-family:'Noto Serif KR',serif;
  font-size:12px;font-weight:200;
  padding:12px 32px;
  border-radius:32px;
  opacity:0;
  transition:opacity 0.6s ease,transform 0.6s ease;
  pointer-events:none;z-index:400;
  letter-spacing:0.08em;
  box-shadow:0 4px 30px rgba(0,0,0,0.3);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ─── MINI INTRO ─── */
#miniIntro{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:200}

/* ─── MOBILE ─── */
@media(max-width:480px){
  .header{padding:12px 16px}
  .msg{padding:12px 18px}
  .msg-q{padding-right:42px}
  .msg-user{padding-left:56px;padding-right:18px}
  .input-area{padding:8px 12px 20px 12px}
  .side-panel{width:280px}
  .modal-box{padding:36px 28px 26px}
  .about-input{width:220px}
}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- ─── INTRO SCREEN ─── -->
<div id="introScreen">
  <div class="intro-glow" id="introGlow"></div>
  <div class="intro-text" id="introText1">It was Q</div>
  <div class="intro-text" id="introText2">It is Q</div>
  <div class="intro-text" id="introText3">It will be Q</div>
  <div class="intro-input-wrap" id="introInputWrap">
    <span class="intro-input-label">It </span><input type="text" class="intro-input-field" id="introInputField" placeholder="" autocomplete="off">
  </div>
  <div class="intro-text" id="introText4">It always</div>
  <img src="/static/icons/Q_transparent.png" class="intro-q-icon" id="introQIcon" alt="Q,">
</div>

<!-- ─── WAKE SCREEN ─── -->
<div id="wakeScreen">
  <div class="wake-glow" id="wakeGlow"></div>
  <div class="wake-question" id="wakeQuestion">왜 나를 깨웠어?</div>
</div>

<!-- ─── PANELS ─── -->
<div class="overlay" id="overlay" onclick="closeAllPanels()"></div>

<div class="side-panel" id="logPanel">
  <div class="panel-header"><span class="panel-title">대화 기록</span><button class="panel-close" onclick="closeAllPanels()">&times;</button></div>
  <div class="panel-body" id="logList"><div class="log-empty">아직 기록이 없어</div></div>
</div>

<!-- ─── MENUS ─── -->
<div class="settings-menu" id="settingsMenu" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="menu-box">
    <div class="menu-item" onclick="openAboutQ()">Q에 대하여</div>
    <div class="menu-item" onclick="openAboutYou()">당신에 대하여</div>
  </div>
</div>

<div class="settings-menu" id="memoryMenu" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="menu-box">
    <div class="menu-item" onclick="openMemoryList()">기억 목록</div>
    <div class="menu-item" onclick="confirmMemoryReset()">기억 초기화</div>
  </div>
</div>

<!-- ─── MODAL ─── -->
<div class="modal-bg" id="modalBg">
  <div class="modal-box">
    <div class="modal-text" id="modalText">내가 널 지우길 바라?</div>
    <div class="modal-buttons">
      <button class="modal-btn" onclick="closeModal()">아니</button>
      <button class="modal-btn" onclick="modalConfirm()">응</button>
    </div>
  </div>
</div>

<!-- ─── ABOUT Q PAGE ─── -->
<div class="full-page" id="aboutQPage">
  <div class="fp-header"><button class="fp-back" onclick="closeFP('aboutQPage')">&#8592;</button><span class="fp-title">Q에 대하여</span></div>
  <div class="fp-body"><div class="aboutq-day">
    <div class="aboutq-day-title" id="aboutQDayTitle">Q Day 1</div>
    <div class="aboutq-status" id="aboutQStatus">아직 낯설어.</div>
    <div class="aboutq-divider"></div>
    <div class="aboutq-section"><div class="aboutq-section-label">너에 대해</div><div class="aboutq-section-text" id="aboutQYou">하루가 조용할 거야</div></div>
    <div class="aboutq-section"><div class="aboutq-section-label">바깥</div><div class="aboutq-section-text" id="aboutQOutside">그냥 그래.</div></div>
    <div class="aboutq-section"><div class="aboutq-section-label" id="aboutQTimeLabel">오후야.</div></div>
    <div class="aboutq-footer"><div class="aboutq-divider" style="margin-bottom:20px"></div><div class="aboutq-footer-brand">re.Moon &#9789;</div><div class="aboutq-footer-copy">&copy; 2025 문리현. All rights reserved.</div></div>
  </div></div>
</div>

<!-- ─── ABOUT YOU PAGE ─── -->
<div class="full-page" id="aboutYouPage">
  <div class="fp-header"><button class="fp-back" onclick="closeFP('aboutYouPage')">&#8592;</button><span class="fp-title">당신에 대하여</span></div>
  <div class="fp-body"><div class="about-section">
    <div class="about-label">내가 널 어떻게 부르면 좋을까?</div>
    <input type="text" class="about-input" id="userName" placeholder="이름" autocomplete="off"><br>
    <button class="about-btn" onclick="saveName()">간직할게</button>
    <div class="about-sub">
      <div class="about-sub-label">넌 어디에 있을 때 너야?</div>
      <div class="about-sub-dim" id="locationDisplay">아직 몰라.</div>
      <button class="about-btn" id="locationBtn" onclick="detectLocation()" style="margin-top:12px">지금 여기</button>
    </div>
  </div></div>
</div>

<!-- ─── MEMORY PAGE ─── -->
<div class="full-page" id="memoryPage">
  <div class="fp-header"><button class="fp-back" onclick="closeFP('memoryPage')">&#8592;</button><span class="fp-title">기억</span></div>
  <div class="fp-body">
    <div class="memory-search"><span class="memory-search-icon">Q,</span><input type="text" class="memory-search-input" id="memorySearchInput" placeholder="기억을 찾아줄게" autocomplete="off" oninput="filterMemories()"></div>
    <div id="memoryListContent"><div class="memory-empty">기억나진 않지만<br>기억하고 싶어.</div></div>
  </div>
</div>

<!-- ─── MINI INTRO ─── -->
<div id="miniIntro">
  <div class="intro-glow" id="miniGlow"></div>
  <div class="intro-text" id="miniText">It always</div>
  <img src="/static/icons/Q_transparent.png" class="intro-q-icon" id="miniQIcon" alt="Q,">
</div>

<!-- ─── CHAT SCREEN ─── -->
<div id="chatScreen">
  <div class="chat-wrap">
    <div class="header">
      <div class="header-left"><img src="/static/icons/log_menu.png" class="icon" alt="menu" onclick="openMemoryMenu()"></div>
      <div class="header-center"><img src="/static/icons/Q_transparent.png" class="icon" style="width:16px;height:16px;opacity:0.25" alt="Q"></div>
      <div class="header-right">
        <img src="/static/icons/session_new.png" class="icon" style="width:20px;height:20px;opacity:0.3;cursor:pointer" onclick="requestNewSession()" alt="new">
        <span class="dots-icon" onclick="document.getElementById('settingsMenu').classList.add('open')">&#8942;</span>
      </div>
    </div>
    <div class="chat-area" id="chatArea"></div>
    <div class="input-area">
      <div class="input-container">
        <div class="input-btn gallery-btn" onclick="document.getElementById('galleryInput').click()"><img src="/static/icons/gallery_input.png" class="icon" alt="gallery"></div>
        <input type="file" id="galleryInput" accept="image/*" style="display:none" onchange="handleImageUpload(this)">
        <input type="text" class="input-field" id="msgInput" placeholder="To. Q" autocomplete="off">
        <div class="input-btn" onclick="toggleVoiceInput()"><img src="/static/icons/voice_input.png" class="icon" id="iconVoiceInput" alt="voice"></div>
        <div class="input-btn"><img src="/static/icons/text_input.png" class="icon" id="iconTextInput" alt="send"></div>
      </div>
    </div>
  </div>
</div>

<script>
var API="https://q-server-nsez.onrender.com",userId="",isWaiting=false,lastUserMsg="",chatHistory=[],sessions=JSON.parse(localStorage.getItem('q_sessions')||'[]'),currentSpeech=null,recognition=null,isRecording=false,modalCallback=null;
var userName=localStorage.getItem('q_username')||'',userLocation=localStorage.getItem('q_location')||'';
var startDate=localStorage.getItem('q_startdate');if(!startDate){startDate=new Date().toISOString();localStorage.setItem('q_startdate',startDate)}
var settings=JSON.parse(localStorage.getItem('q_settings')||'{}');if(settings.scan===undefined)settings.scan=true;if(!settings.charSpeed)settings.charSpeed='25';if(!settings.ttsRate)settings.ttsRate='0.85';if(settings.autoTTS===undefined)settings.autoTTS=false;

// INTRO
(function(){
var tl=[{t:600,s:'introText1'},{t:2400,h:'introText1'},{t:3600,s:'introText2'},{t:5800,h:'introText2'},{t:7200,s:'introText3'},{t:9800,h:'introText3'},{t:11200,fn:showIntroInput}];
playIntroDrone();tl.forEach(function(e){setTimeout(function(){if(e.s)document.getElementById(e.s).classList.add('visible');if(e.h){var el=document.getElementById(e.h);el.classList.remove('visible');el.classList.add('fade')}if(e.fn)e.fn()},e.t)});
function showIntroInput(){var w=document.getElementById('introInputWrap'),f=document.getElementById('introInputField');w.classList.add('visible');setTimeout(function(){f.focus()},500);f.addEventListener('focus',function(){tryPlayIntroAudio()});f.addEventListener('input',function(){tryPlayIntroAudio()});f.addEventListener('keydown',function handler(e){if(e.key==='Enter'&&!e.isComposing){e.preventDefault();var v=f.value.trim();if(v)localStorage.setItem('q_user_intro',v);w.classList.remove('visible');w.classList.add('fade');setTimeout(function(){document.getElementById('introText4').classList.add('visible')},1400);setTimeout(function(){var el=document.getElementById('introText4');el.classList.remove('visible');el.classList.add('fade')},5000);setTimeout(function(){document.getElementById('introQIcon').classList.add('visible')},6200);setTimeout(transitionToWake,9500);f.removeEventListener('keydown',handler)}})}
})();

function transitionToWake(){stopIntroDrone();var i=document.getElementById('introScreen');i.style.transition='opacity 1.8s ease';i.style.opacity='0';setTimeout(function(){i.style.display='none';var w=document.getElementById('wakeScreen');w.style.display='flex';w.style.opacity='0';w.style.transition='opacity 1.2s ease';requestAnimationFrame(function(){w.style.opacity='1'});setTimeout(function(){document.getElementById('wakeQuestion').classList.add('visible')},900);w.addEventListener('click',function(){transitionToChat()},{once:true})},1800)}

function transitionToChat(){userId="web_"+Date.now()+"_"+Math.random().toString(36).slice(2,6);var w=document.getElementById('wakeScreen');w.style.transition='opacity 1.5s ease';w.style.opacity='0';setTimeout(function(){w.style.display='none';var c=document.getElementById('chatScreen');c.style.display='flex';c.style.opacity='0';c.style.transition='opacity 1s ease';requestAnimationFrame(function(){c.style.opacity='1'});updateAboutQ();if(userName)document.getElementById('userName').value=userName},1600)}

// PANELS
function openLogPanel(){document.getElementById('memoryMenu').classList.remove('open');renderLogList();document.getElementById('overlay').classList.add('open');document.getElementById('logPanel').classList.add('open')}
function closeAllPanels(){document.getElementById('overlay').classList.remove('open');document.getElementById('logPanel').classList.remove('open')}
function openMemoryMenu(){document.getElementById('memoryMenu').classList.add('open')}
function openAboutQ(){document.getElementById('settingsMenu').classList.remove('open');document.getElementById('aboutQPage').classList.add('open');updateAboutQ()}
function openAboutYou(){document.getElementById('settingsMenu').classList.remove('open');document.getElementById('aboutYouPage').classList.add('open');if(userName)document.getElementById('userName').value=userName;var saved=localStorage.getItem('q_location');if(saved){document.getElementById('locationDisplay').textContent='Q가 기억하는 장소가 있어';document.getElementById('locationBtn').style.display='none'}}
function openMemoryList(){document.getElementById('memoryMenu').classList.remove('open');document.getElementById('memoryPage').classList.add('open');renderMemories()}
function closeFP(id){document.getElementById(id).classList.remove('open')}

// MODAL
function openModal(t,cb){document.getElementById('modalText').textContent=t;document.getElementById('modalBg').classList.add('open');modalCallback=cb}
function closeModal(){document.getElementById('modalBg').classList.remove('open');modalCallback=null}
function modalConfirm(){if(modalCallback)modalCallback();closeModal()}

// ABOUT YOU
function saveName(){var v=document.getElementById('userName').value.trim();if(!v){showToast('이름을 알려줘');return}userName=v;localStorage.setItem('q_username',userName);showToast('간직할게, '+userName)}
function saveLocation(){if(!navigator.geolocation){showToast('위치를 찾을 수 없어');return}navigator.geolocation.getCurrentPosition(function(p){userLocation=p.coords.latitude.toFixed(4)+','+p.coords.longitude.toFixed(4);localStorage.setItem('q_location',userLocation);showToast('여기구나.')},function(){showToast('위치를 알 수 없었어')})}
function detectLocation(){var ld=document.getElementById('locationDisplay'),lb=document.getElementById('locationBtn');if(!navigator.geolocation){showToast('위치를 찾을 수 없어');return}ld.textContent='찾고 있어...';lb.style.display='none';navigator.geolocation.getCurrentPosition(function(p){var lat=p.coords.latitude,lon=p.coords.longitude;localStorage.setItem('q_location_coords',lat+','+lon);localStorage.setItem('q_location','saved');ld.textContent='Q가 기억하는 장소가 있어';showToast('여기구나.')},function(){ld.textContent='아직 몰라.';lb.style.display='';showToast('위치를 알 수 없었어')})}

// ABOUT Q
function updateAboutQ(){var firstLaunch=localStorage.getItem('q_startdate_ms');if(!firstLaunch){firstLaunch=Date.now();localStorage.setItem('q_startdate_ms',firstLaunch)}fetch(API+"/q-status?user_id="+encodeURIComponent(userId)+"&first_launch="+firstLaunch).then(function(r){return r.json()}).then(function(d){document.getElementById('aboutQDayTitle').textContent='Q Day '+(d.q_day||1);document.getElementById('aboutQStatus').textContent=d.q_feeling||'그냥 여기 있어.';document.getElementById('aboutQYou').textContent=d.about_you||'아직 잘 모르겠어.';document.getElementById('aboutQOutside').textContent=d.mood||'그냥 그래.';var h=d.hour||new Date().getHours();document.getElementById('aboutQTimeLabel').textContent=h<6?'새벽이야.':h<12?'오전이야.':h<18?'오후야.':'밤이야.'}).catch(function(){var n=new Date(),s=new Date(startDate),dd=Math.floor((n-s)/(1000*60*60*24))+1;document.getElementById('aboutQDayTitle').textContent='Q Day '+dd;var h=n.getHours();document.getElementById('aboutQTimeLabel').textContent=h<6?'새벽이야.':h<12?'오전이야.':h<18?'오후야.':'밤이야.'})}

// MEMORY
function getMemories(){return JSON.parse(localStorage.getItem('q_memories')||'[]')}
function saveMemory(t,s){var m=getMemories();m.push({title:t,sub:s||'',time:Date.now()});if(m.length>100)m.shift();localStorage.setItem('q_memories',JSON.stringify(m))}
function renderMemories(){var el=document.getElementById('memoryListContent');if(sessions.length===0){el.innerHTML='<div class="memory-empty">기억나진 않지만<br>기억하고 싶어.</div>';return}var h='';for(var i=sessions.length-1;i>=0;i--){var p=sessions[i].preview||'...';var t=sessions[i].time||'';h+='<div class="memory-item" onclick="loadSessionInMemory('+i+')" style="cursor:pointer"><div class="memory-item-title">'+esc(p)+'</div><div class="memory-item-sub">'+esc(t)+'</div></div>'}el.innerHTML=h}
function loadSessionInMemory(i){closeFP('memoryPage');var s=sessions[i];if(!s||!s.messages)return;document.getElementById('chatArea').innerHTML='';chatHistory=[];for(var j=0;j<s.messages.length;j++){var m=s.messages[j];if(m.role==='user')addUserMessage(m.text);else addQMessage(m.text,false,j===s.messages.length-1,true);chatHistory.push(m)}}
function filterMemories(){var q=document.getElementById('memorySearchInput').value.trim().toLowerCase(),el=document.getElementById('memoryListContent');if(!q){renderMemories();return}var f=[];for(var i=0;i<sessions.length;i++){var s=sessions[i],match=false;if(s.preview&&s.preview.toLowerCase().includes(q))match=true;if(!match&&s.messages){for(var j=0;j<s.messages.length;j++){if(s.messages[j].text&&s.messages[j].text.toLowerCase().includes(q)){match=true;break}}}if(match)f.push({idx:i,session:s})}if(f.length===0){el.innerHTML='<div class="memory-empty">모르겠는데, 넌 뭘 물어보는 거야?<br><span style="font-size:12px;opacity:0.5">알 바야?</span></div>';return}var h='';for(var k=f.length-1;k>=0;k--){var p=f[k].session.preview||'...';var t=f[k].session.time||'';h+='<div class="memory-item" onclick="loadSessionInMemory('+f[k].idx+')" style="cursor:pointer"><div class="memory-item-title">'+esc(p)+'</div><div class="memory-item-sub">'+esc(t)+'</div></div>'}el.innerHTML=h}
function confirmMemoryReset(){document.getElementById('memoryMenu').classList.remove('open');closeFP('memoryPage');openModal('내가 널 지우길 바라?',function(){sessions=[];localStorage.removeItem('q_sessions');chatHistory=[];lastUserMsg='';document.getElementById('chatArea').innerHTML='';userId="web_"+Date.now()+"_"+Math.random().toString(36).slice(2,6);playMiniIntro()})}
function autoSaveMemory(u,q){if(u.length>2&&q.length>2&&q!=='...'&&q!=='(침묵)')saveMemory(q.substring(0,60),u.substring(0,40))}

// LOG
function renderLogList(){var el=document.getElementById('logList');if(sessions.length===0){el.innerHTML='<div class="log-empty">아직 기록이 없어</div>';return}var h='';for(var i=sessions.length-1;i>=0;i--)h+='<div class="log-item" onclick="loadSession('+i+')"><div class="log-preview">'+esc(sessions[i].preview||'...')+'</div><div class="log-time">'+(sessions[i].time||'')+'</div></div>';el.innerHTML=h}
function saveCurrentSession(){if(chatHistory.length===0)return;var f=chatHistory.find(function(m){return m.role==='user'});var p=f?f.text:'...';if(p.length>40)p=p.substring(0,40)+'...';var n=new Date();var t=n.getFullYear()+'.'+pad(n.getMonth()+1)+'.'+pad(n.getDate())+' '+pad(n.getHours())+':'+pad(n.getMinutes());sessions.push({preview:p,time:t,messages:JSON.parse(JSON.stringify(chatHistory))});if(sessions.length>30)sessions.shift();localStorage.setItem('q_sessions',JSON.stringify(sessions))}
function loadSession(i){closeAllPanels();var s=sessions[i];if(!s||!s.messages)return;document.getElementById('chatArea').innerHTML='';chatHistory=[];for(var j=0;j<s.messages.length;j++){var m=s.messages[j];if(m.role==='user')addUserMessage(m.text);else addQMessage(m.text,false,j===s.messages.length-1,true);chatHistory.push(m)}}
function pad(n){return n<10?'0'+n:''+n}

// NEW SESSION
function requestNewSession(){if(isWaiting)return;if(chatHistory.length===0)return;saveCurrentSession();chatHistory=[];lastUserMsg='';document.getElementById('chatArea').innerHTML='';userId="web_"+Date.now()+"_"+Math.random().toString(36).slice(2,6)}
var introAudio=null;var introAudioStarted=false;function tryPlayIntroAudio(){if(introAudioStarted||!introAudio)return;introAudio.play().then(function(){introAudioStarted=true;var fade=setInterval(function(){if(!introAudio)return clearInterval(fade);if(introAudio.volume<0.4){introAudio.volume=Math.min(introAudio.volume+0.02,0.4)}else{clearInterval(fade)}},100)}).catch(function(){})}function playIntroDrone(){try{introAudio=new Audio('/static/solitude.mp3');introAudio.volume=0;introAudio.loop=false;tryPlayIntroAudio();document.addEventListener('click',function h(){tryPlayIntroAudio();document.removeEventListener('click',h)});document.addEventListener('touchstart',function h(){tryPlayIntroAudio();document.removeEventListener('touchstart',h)});document.addEventListener('keydown',function h(){tryPlayIntroAudio();document.removeEventListener('keydown',h)})}catch(e){}}
function stopIntroDrone(){try{if(introAudio){var a=introAudio;var fade=setInterval(function(){if(a.volume>0.02){a.volume=Math.max(a.volume-0.02,0)}else{clearInterval(fade);a.pause();a=null}},80);introAudio=null}}catch(e){}}
function playMiniIntro(){var cs=document.getElementById('chatScreen');cs.style.transition='opacity 0.8s ease';cs.style.opacity='0';setTimeout(function(){cs.style.display='none';var mi=document.getElementById('miniIntro');mi.style.display='flex';mi.style.opacity='0';mi.style.transition='opacity 0.5s ease';requestAnimationFrame(function(){mi.style.opacity='1'});var t1=document.getElementById('miniText');var qi=document.getElementById('miniQIcon');var mg=document.getElementById('miniGlow');setTimeout(function(){t1.classList.add('visible')},600);setTimeout(function(){t1.classList.remove('visible');t1.classList.add('fade')},2800);setTimeout(function(){qi.classList.add('visible')},3500);setTimeout(function(){mi.style.transition='opacity 1.2s ease';mi.style.opacity='0'},6000);setTimeout(function(){mi.style.display='none';t1.className='intro-text';qi.className='intro-q-icon';mg.className='intro-glow';cs.style.display='flex';cs.style.opacity='0';cs.style.transition='opacity 0.8s ease';requestAnimationFrame(function(){cs.style.opacity='1'})},7300)},900)}

function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1800)}

// VOICE INPUT
function toggleVoiceInput(){if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){showToast('음성 입력을 지원하지 않아');return}if(isRecording){stopVoiceInput();return}var SR=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SR();recognition.lang='ko-KR';recognition.interimResults=true;recognition.continuous=false;var inp=document.getElementById('msgInput'),ic=document.getElementById('iconVoiceInput');recognition.onstart=function(){isRecording=true;ic.classList.add('recording');inp.placeholder='듣고 있어...'};recognition.onresult=function(e){var t='';for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;inp.value=t};recognition.onend=function(){isRecording=false;ic.classList.remove('recording');inp.placeholder='To. Q';if(inp.value.trim())sendMessage()};recognition.onerror=function(e){isRecording=false;ic.classList.remove('recording');inp.placeholder='To. Q';if(e.error!=='no-speech')showToast('음성 인식 실패')};recognition.start()}
function stopVoiceInput(){if(recognition)recognition.stop();isRecording=false;document.getElementById('iconVoiceInput').classList.remove('recording')}

// TTS
var currentAudio=null;function speakText(t,ic){if(currentAudio){currentAudio.pause();currentAudio=null}var c=t.replace(/\n/g,'. ').replace(/\s+/g,' ').trim();if(!c)return;if(ic)ic.classList.add('active');fetch(API+'/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:c})}).then(function(r){if(!r.ok)throw new Error('tts fail');return r.blob()}).then(function(b){var url=URL.createObjectURL(b);var a=new Audio(url);currentAudio=a;a.onended=function(){if(ic)ic.classList.remove('active');currentAudio=null;URL.revokeObjectURL(url)};a.onerror=function(){if(ic)ic.classList.remove('active');currentAudio=null};a.play()}).catch(function(){if(ic)ic.classList.remove('active');showToast('음성을 불러올 수 없어')})}

function copyText(t,ic){navigator.clipboard.writeText(t).then(function(){showToast('간직해줘');if(ic){ic.classList.add('active');setTimeout(function(){ic.classList.remove('active')},800)}}).catch(function(){showToast('복사 실패')})}
function retryLast(){if(isWaiting||!lastUserMsg)return;var c=document.getElementById('chatArea'),ms=c.querySelectorAll('.msg');for(var i=ms.length-1;i>=0;i--)if(ms[i].classList.contains('msg-q')||ms[i].classList.contains('msg-silence')){c.removeChild(ms[i]);chatHistory.pop();break}sendToQ(lastUserMsg)}

// INPUT
document.getElementById('msgInput').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.isComposing&&!isWaiting)sendMessage()});
document.getElementById('iconTextInput').addEventListener('click',function(){if(!isWaiting)sendMessage()});

function sendMessage(){var inp=document.getElementById('msgInput'),t=inp.value.trim();if(!t||isWaiting)return;inp.value='';lastUserMsg=t;addUserMessage(t);chatHistory.push({role:'user',text:t,time:Date.now()});sendToQ(t)}
function handleImageUpload(input){if(!input.files||!input.files[0])return;var file=input.files[0];var reader=new FileReader();reader.onload=function(e){var origSrc=e.target.result;var img=new Image();img.onload=function(){var max=800,w=img.width,h=img.height;if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}var canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;var ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);var b64=canvas.toDataURL('image/jpeg',0.8).split(',')[1];addUserImage(origSrc);chatHistory.push({role:'user',text:'[사진]',time:Date.now()});isWaiting=true;var rd=showReading();fetch(API+'/vision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:b64,media_type:'image/jpeg',user_id:userId})}).then(function(r){return r.json()}).then(function(d){removeEl(rd);isWaiting=false;if(d.reply){addQMessage(d.reply);chatHistory.push({role:'assistant',text:d.reply,time:Date.now()})}}).catch(function(){removeEl(rd);isWaiting=false;addQMessage('...')})};img.src=e.target.result};reader.readAsDataURL(file);input.value=''}
function addUserImage(src){var c=document.getElementById('chatArea'),d=document.createElement('div');d.className='msg msg-user';var im=document.createElement('img');im.src=src;im.style.cssText='max-width:200px;max-height:200px;border-radius:12px;opacity:0.85;display:block;margin-left:auto';d.appendChild(im);c.appendChild(d);scrollEnd()}

function sendToQ(t){isWaiting=true;var rd=showReading();fetch(API+"/reply",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:t,name:userName,user_id:userId})}).then(function(r){return r.json()}).then(function(d){removeEl(rd);var af=settings.scan?glowScanLastUser():Promise.resolve();af.then(function(){var rt='';if(d.silence){showSilence();rt='(침묵)'}else if(d.breaths&&d.breaths.length>1){addBreaths(d.breaths);rt=d.breaths.map(function(b){return b.text}).join('\n')}else{rt=d.reply||'...';addQMessage(rt)}chatHistory.push({role:'q',text:rt,time:Date.now()});autoSaveMemory(lastUserMsg,rt);if(settings.autoTTS&&rt&&rt!=='(침묵)')speakText(rt);isWaiting=false})}).catch(function(){removeEl(rd);addQMessage("...");isWaiting=false})}

function addBreaths(b){var i=0;function n(){if(i>=b.length)return;var l=(i===b.length-1);addQMessage(b[i].text,i>0,l);var p=b[i].pause_ms||0;i++;if(p>0&&i<b.length)setTimeout(n,p);else n()}n()}

function addUserMessage(t){var c=document.getElementById('chatArea'),d=document.createElement('div');d.className='msg msg-user';var s=document.createElement('span');s.className='user-text';s.textContent=t;d.appendChild(s);c.appendChild(d);scrollEnd()}

function addQMessage(t,cont,acts,inst){t=t.replace(/\[silence\]/g,'').trim();if(!t)return;if(cont===undefined)cont=false;if(acts===undefined)acts=true;if(inst===undefined)inst=false;var c=document.getElementById('chatArea'),d=document.createElement('div');d.className='msg msg-q';var h='',sp=parseInt(settings.charSpeed)||25;
if(!cont)h+='<div class="q-label"><img src="/static/icons/ic_comma_only.png" class="icon" style="width:14px;height:14px;opacity:0.2;filter:drop-shadow(0 0 8px rgba(255,255,255,0.12))" alt="Q"></div>';
if(inst){h+='<div class="q-text">'+esc(t).replace(/\n/g,'<br>')+'</div>'}else{var cs='';for(var i=0;i<t.length;i++){var ch=t[i];if(ch===' ')cs+=' ';else if(ch==='\n')cs+='<br>';else cs+='<span class="qc" style="opacity:0">'+esc(ch)+'</span>'}h+='<div class="q-text">'+cs+'</div>'}
if(acts)h+='<div class="q-actions"><img src="/static/icons/quote_copy.png" class="icon" alt="copy" data-action="copy"><img src="/static/icons/voice_output.png" class="icon" alt="listen" data-action="speak"><img src="/static/icons/reply_refresh.png" class="icon" alt="retry" data-action="retry"></div>';
d.innerHTML=h;var qt=t;d.querySelectorAll('[data-action]').forEach(function(b){b.addEventListener('click',function(){var a=b.getAttribute('data-action');if(a==='copy')copyText(qt,b);else if(a==='speak')speakText(qt,b);else if(a==='retry')retryLast()})});
c.appendChild(d);scrollEnd();
if(!inst){var spans=d.querySelectorAll('.qc');for(var si=0;si<spans.length;si++){(function(el,idx){setTimeout(function(){el.style.transition='opacity 0.3s ease';el.style.opacity='1'},idx*sp)})(spans[si],si)}}}

function glowScanLastUser(){return new Promise(function(res){var a=document.querySelectorAll('.user-text'),l=a[a.length-1];if(!l){res();return}var t=l.textContent,ch=t.split(''),h='';for(var j=0;j<ch.length;j++)h+='<span>'+esc(ch[j])+'</span>';l.innerHTML=h;var sp=l.querySelectorAll('span'),i=0,s=Math.max(35,Math.min(100,1000/ch.length));function st(){if(i>=sp.length){l.classList.add('scanned');setTimeout(res,250);return}sp[i].classList.add('word-glow');var c=i;setTimeout(function(){sp[c].classList.remove('word-glow')},180);i++;setTimeout(st,s+(Math.random()*40-20))}setTimeout(st,150)})}
function showSilence(){var c=document.getElementById('chatArea'),d=document.createElement('div');d.className='msg msg-silence';d.innerHTML='<div class="silence-dot"></div>';c.appendChild(d);scrollEnd()}
function showReading(){var c=document.getElementById('chatArea'),d=document.createElement('div');d.className='reading-dots';d.innerHTML='<div class="r-dot"></div><div class="r-dot"></div><div class="r-dot"></div>';c.appendChild(d);scrollEnd();return d}
function removeEl(e){if(e&&e.parentNode)e.parentNode.removeChild(e)}
function scrollEnd(){var c=document.getElementById('chatArea');if(c)c.scrollTop=c.scrollHeight}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

window.addEventListener('beforeunload',function(){saveCurrentSession()});
</script>
</body>
</html>
