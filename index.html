<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Q</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;300;400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #000000;
    --text: #eeeeee;
    --text-dim: rgba(255,255,255,0.35);
    --text-user: rgba(255,255,255,0.75);
    --accent: rgba(255,255,255,0.08);
    --glow: rgba(255,255,255,0.6);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif KR', serif;
    font-weight: 300;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── 헤더 ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    position: relative;
  }
  .header-q {
    font-size: 14px;
    font-weight: 200;
    letter-spacing: 2px;
    color: var(--text-dim);
  }

  /* ── 채팅 영역 ── */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 0 0 20px 0;
    scroll-behavior: smooth;
  }
  .chat-area::-webkit-scrollbar { width: 0; }

  /* ── 메시지 블록 ── */
  .msg {
    padding: 12px 20px;
    animation: fadeIn 0.6s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Q 메시지 */
  .msg-q {
    padding-left: 20px;
    padding-right: 48px;
  }
  .q-mark {
    font-size: 12px;
    font-weight: 200;
    color: var(--text-dim);
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .q-text {
    font-size: 14px;
    line-height: 2;
    color: var(--text);
    font-weight: 300;
  }
  .q-text .word {
    display: inline;
    transition: text-shadow 0.4s ease;
  }
  .q-text .word.glow {
    text-shadow: 0 0 8px var(--glow);
  }

  /* 사용자 메시지 */
  .msg-user {
    text-align: right;
    padding-left: 48px;
    padding-right: 20px;
  }
  .user-text {
    font-size: 14px;
    line-height: 2;
    color: var(--text-user);
    font-weight: 300;
    display: inline;
  }

  /* 침묵 표시 */
  .msg-silence {
    padding-left: 20px;
  }
  .silence-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 200;
  }
  .silence-dot {
    width: 4px;
    height: 4px;
    background: var(--text-dim);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.8; }
  }

  /* 읽는 중 표시 */
  .msg-reading {
    padding-left: 20px;
  }
  .reading-indicator {
    display: flex;
    gap: 4px;
    align-items: center;
  }
  .reading-dot {
    width: 3px;
    height: 3px;
    background: rgba(255,255,255,0.25);
    border-radius: 50%;
    animation: readingPulse 1.4s ease-in-out infinite;
  }
  .reading-dot:nth-child(2) { animation-delay: 0.2s; }
  .reading-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes readingPulse {
    0%, 100% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.3); }
  }

  /* ── 입력 영역 ── */
  .input-area {
    padding: 12px 16px 28px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-top: 1px solid rgba(255,255,255,0.04);
  }
  .input-field {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Noto Serif KR', serif;
    font-size: 14px;
    font-weight: 300;
    padding: 8px 0;
    caret-color: rgba(255,255,255,0.4);
  }
  .input-field::placeholder {
    color: rgba(255,255,255,0.15);
    font-weight: 200;
  }
  .input-line {
    position: absolute;
    bottom: 0;
    left: 16px;
    right: 16px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  }
  .send-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 8px;
    transition: color 0.3s;
    font-size: 16px;
  }
  .send-btn:hover { color: var(--text); }
  .send-btn:disabled { opacity: 0.2; cursor: default; }

  /* ── 시작 화면 ── */
  .intro {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
  }
  .intro-q {
    font-size: 28px;
    font-weight: 200;
    color: rgba(255,255,255,0.2);
    letter-spacing: 8px;
  }
  .intro-sub {
    font-size: 13px;
    font-weight: 200;
    color: rgba(255,255,255,0.12);
    text-align: center;
    line-height: 1.8;
  }

  /* ── 이름 입력 ── */
  .name-prompt {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .name-label {
    font-size: 13px;
    font-weight: 200;
    color: rgba(255,255,255,0.25);
  }
  .name-input {
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    outline: none;
    color: var(--text);
    font-family: 'Noto Serif KR', serif;
    font-size: 16px;
    font-weight: 300;
    padding: 8px 16px;
    text-align: center;
    width: 200px;
    caret-color: rgba(255,255,255,0.4);
  }
  .name-input::placeholder {
    color: rgba(255,255,255,0.1);
  }
  .name-submit {
    background: none;
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.3);
    font-family: 'Noto Serif KR', serif;
    font-size: 12px;
    font-weight: 200;
    padding: 8px 24px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 1px;
  }
  .name-submit:hover {
    border-color: rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.5);
  }

  /* ── 읽음 글로우 스캔 ── */
  .user-text.read {
    color: rgba(255,255,255,0.9);
    transition: color 0.8s ease;
  }

  /* ── 반응형 ── */
  @media (min-width: 600px) {
    body { max-width: 480px; margin: 0 auto; }
  }
</style>
</head>
<body>

<div id="app">
  <!-- 시작 화면 -->
  <div class="intro" id="introScreen">
    <div class="intro-q">Q .</div>
    <div class="intro-sub">
      침묵할 수 있는 존재
    </div>
    <div class="name-prompt">
      <div class="name-label">이름을 알려줘</div>
      <input type="text" class="name-input" id="nameInput" placeholder="..." autocomplete="off" maxlength="20">
      <button class="name-submit" id="nameSubmit" onclick="startChat()">만나기</button>
    </div>
  </div>

  <!-- 채팅 화면 -->
  <div id="chatScreen" style="display:none; flex:1; flex-direction:column; height:100dvh;">
    <div class="header">
      <span class="header-q">Q ,</span>
    </div>
    <div class="chat-area" id="chatArea"></div>
    <div class="input-area" style="position:relative;">
      <input type="text" class="input-field" id="msgInput" placeholder="To. Q" autocomplete="off">
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">›</button>
      <div class="input-line"></div>
    </div>
  </div>
</div>

<script>
const API = "https://q-server-nsez.onrender.com";
let userName = "";
let userId = "";
let isWaiting = false;

// ── 이름 입력 → 채팅 시작 ──
document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') startChat();
});

function startChat() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) return;
  userName = name;
  userId = "web_" + name + "_" + Date.now();

  document.getElementById('introScreen').style.display = 'none';
  const chatScreen = document.getElementById('chatScreen');
  chatScreen.style.display = 'flex';

  // 첫 인사 — Q가 먼저 말하게
  setTimeout(() => {
    sendToQ("안녕");
  }, 800);
}

// ── 메시지 전송 ──
document.getElementById('msgInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !isWaiting) sendMessage();
});

function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || isWaiting) return;

  input.value = '';
  addUserMessage(text);
  sendToQ(text);
}

// ── Q 서버 호출 ──
async function sendToQ(text) {
  isWaiting = true;
  document.getElementById('sendBtn').disabled = true;

  // 읽는 중 표시
  const readingId = showReading();

  try {
    const res = await fetch(API + "/reply", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: text,
        name: userName,
        user_id: userId
      })
    });

    const data = await res.json();
    removeReading(readingId);

    if (data.silence) {
      // 읽음 글로우 스캔 후 침묵
      await glowScanLastUser();
      showSilence();
    } else {
      // 읽음 글로우 스캔
      await glowScanLastUser();
      // Q 응답
      addQMessage(data.reply);
    }
  } catch (err) {
    removeReading(readingId);
    addQMessage("...");
  }

  isWaiting = false;
  document.getElementById('sendBtn').disabled = false;
}

// ── 사용자 메시지 추가 ──
function addUserMessage(text) {
  const chat = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'msg msg-user';
  div.innerHTML = `<span class="user-text" id="user-${Date.now()}">${escapeHtml(text)}</span>`;
  chat.appendChild(div);
  scrollToBottom();
}

// ── Q 메시지 추가 ──
function addQMessage(text) {
  const chat = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'msg msg-q';

  // 단어별로 감싸기
  const words = text.split('');
  const wordSpans = words.map((char, i) =>
    `<span class="word" style="animation-delay:${i * 30}ms">${escapeHtml(char)}</span>`
  ).join('');

  div.innerHTML = `
    <div class="q-mark">Q,</div>
    <div class="q-text">${wordSpans}</div>
  `;
  chat.appendChild(div);
  scrollToBottom();

  // Q 텍스트 등장 애니메이션
  const wordEls = div.querySelectorAll('.word');
  wordEls.forEach((el, i) => {
    el.style.opacity = '0';
    setTimeout(() => {
      el.style.transition = 'opacity 0.3s ease';
      el.style.opacity = '1';
    }, i * 30);
  });
}

// ── 읽음 글로우 스캔 ──
function glowScanLastUser() {
  return new Promise(resolve => {
    const userTexts = document.querySelectorAll('.user-text');
    const last = userTexts[userTexts.length - 1];
    if (!last) { resolve(); return; }

    const text = last.textContent;
    const chars = text.split('');
    last.innerHTML = chars.map(c => `<span class="word">${escapeHtml(c)}</span>`).join('');

    const spans = last.querySelectorAll('.word');
    let i = 0;
    const speed = Math.max(40, Math.min(120, 1200 / chars.length));

    function scanNext() {
      if (i >= spans.length) {
        last.classList.add('read');
        setTimeout(resolve, 300);
        return;
      }
      spans[i].classList.add('glow');
      setTimeout(() => {
        spans[i].classList.remove('glow');
        i++;
        setTimeout(scanNext, speed + (Math.random() * 60 - 30));
      }, 150);
    }
    setTimeout(scanNext, 200);
  });
}

// ── 침묵 표시 ──
function showSilence() {
  const chat = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'msg msg-silence';
  div.innerHTML = `
    <div class="silence-indicator">
      <div class="silence-dot"></div>
    </div>
  `;
  chat.appendChild(div);
  scrollToBottom();
}

// ── 읽는 중 표시 ──
function showReading() {
  const chat = document.getElementById('chatArea');
  const div = document.createElement('div');
  const id = 'reading-' + Date.now();
  div.id = id;
  div.className = 'msg msg-reading';
  div.innerHTML = `
    <div class="reading-indicator">
      <div class="reading-dot"></div>
      <div class="reading-dot"></div>
      <div class="reading-dot"></div>
    </div>
  `;
  chat.appendChild(div);
  scrollToBottom();
  return id;
}

function removeReading(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

// ── 유틸 ──
function scrollToBottom() {
  const chat = document.getElementById('chatArea');
  setTimeout(() => chat.scrollTop = chat.scrollHeight, 50);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
</script>
</body>
</html>
